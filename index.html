<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HACKER F5 AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #eeeeee;
      color: #171717;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 65px;
      background: #ffffff;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #f0f0f0;
      font-size: 24px;
      color: #b40000;
    }

    .logo {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c40000;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand h1 {
      font-size: 20px;
      color: #b40000;
      letter-spacing: 1px;
    }

    .brand span {
      font-size: 11px;
      color: #666666;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100vh;
      background: #ffffff;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
      z-index: 30;
      padding: 20px 15px;
      transition: left 0.25s ease;
      overflow-y: auto;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .sidebar-top h2 {
      color: #b40000;
      font-size: 20px;
    }

    .close-sidebar {
      border: none;
      background: #eeeeee;
      width: 35px;
      height: 35px;
      border-radius: 10px;
      font-size: 20px;
    }

    .side-button {
      width: 100%;
      border: none;
      background: #f3f3f3;
      color: #222222;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
    }

    .side-button:hover {
      background: #ffe3e3;
      color: #b40000;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 20;
    }

    .overlay.active {
      display: block;
    }

    /* MAIN */

    main {
      flex: 1;
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 20px 15px 120px;
    }

    .welcome {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px 20px;
      text-align: center;
      border: 1px solid #dddddd;
      margin-bottom: 20px;
    }

    .welcome h2 {
      color: #b40000;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .welcome p {
      color: #555555;
      line-height: 1.5;
      font-size: 14px;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 94%;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
      background: #b40000;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .message.ai {
      align-self: flex-start;
      background: #ffffff;
      color: #202020;
      border: 1px solid #dddddd;
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    .message.system {
      align-self: center;
      background: #fff3f3;
      color: #8d0000;
      font-size: 13px;
      text-align: center;
      white-space: pre-wrap;
    }

    .typing {
      color: #777777;
      font-style: italic;
    }

    /* HACKER STYLE */

    .hacker-title {
      color: #b40000;
      font-weight: bold;
      font-size: 17px;
      letter-spacing: 0.5px;
      margin: 10px 0;
    }

    .hacker-line {
      color: #b40000;
      font-weight: bold;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .hacker-symbol {
      color: #b40000;
      font-weight: bold;
    }

    .ai-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* CODE BLOCK */

    .code-wrapper {
      width: 100%;
      margin: 12px 0;
      border-radius: 12px;
      overflow: hidden;
      background: #171717;
      border: 1px solid #444444;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      background: #292929;
      color: #ffffff;
      font-size: 12px;
    }

    .code-language {
      color: #ff7777;
      font-weight: bold;
    }

    .copy-code-button,
    .copy-all-button {
      border: none;
      border-radius: 8px;
      background: #b40000;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 12px;
    }

    .copy-code-button:hover,
    .copy-all-button:hover {
      background: #e00000;
    }

    .code-content {
      padding: 14px;
      overflow-x: auto;
      color: #eeeeee;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
    }

    .response-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* INPUT AREA */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid #dddddd;
      padding: 10px;
      z-index: 15;
    }

    .input-container {
      max-width: 950px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .small-button {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: #eeeeee;
      color: #b40000;
      font-size: 22px;
    }

    .message-input {
      flex: 1;
      min-height: 43px;
      max-height: 130px;
      resize: none;
      border: 1px solid #cccccc;
      border-radius: 13px;
      padding: 12px;
      outline: none;
      background: #ffffff;
      color: #111111;
    }

    .message-input:focus {
      border-color: #b40000;
    }

    .send-button {
      width: 48px;
      height: 43px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: #b40000;
      color: #ffffff;
      font-size: 20px;
    }

    .send-button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    /* SETTINGS */

    .settings-box {
      background: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 16px;
      padding: 18px;
      margin-top: 15px;
    }

    .settings-box h3 {
      color: #b40000;
      margin-bottom: 10px;
    }

    .settings-button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #f0f0f0;
      text-align: left;
      color: #222222;
    }

    .settings-button:hover {
      background: #ffe1e1;
      color: #b40000;
    }

    .language-status {
      margin-top: 10px;
      color: #666666;
      font-size: 13px;
    }

    /* RESPONSIVE */

    @media (min-width: 700px) {
      .sidebar {
        left: 0;
        position: fixed;
      }

      .sidebar.active {
        left: 0;
      }

      .overlay {
        display: none !important;
      }

      main {
        margin-left: 280px;
        max-width: calc(100% - 280px);
      }

      header {
        margin-left: 280px;
      }

      .input-area {
        left: 280px;
      }

      .menu-button {
        display: none;
      }
    }

    @media (max-width: 450px) {
      .brand h1 {
        font-size: 17px;
      }

      .brand span {
        font-size: 10px;
      }

      .message {
        max-width: 100%;
        font-size: 14px;
      }

      .welcome h2 {
        font-size: 21px;
      }

      .code-content {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <h2>👑 HACKER F5</h2>

        <button
          class="close-sidebar"
          onclick="closeSidebar()"
        >
          ×
        </button>
      </div>

      <button
        class="side-button"
        onclick="newConversation()"
      >
        ➕ Nouvelle conversation
      </button>

      <button
        class="side-button"
        onclick="showHistory()"
      >
        🕘 Historique
      </button>

      <button
        class="side-button"
        onclick="prepareCreation()"
      >
        ✨ Créer avec l’IA
      </button>

      <button
        class="side-button"
        onclick="securityAnalysis()"
      >
        🛡️ Analyse sécurité
      </button>

      <button
        class="side-button"
        onclick="codeAnalysis()"
      >
        💻 Analyse de code
      </button>

      <button
        class="side-button"
        onclick="showSettings()"
      >
        ⚙️ Paramètres
      </button>
    </aside>

    <div
      class="overlay"
      id="overlay"
      onclick="closeSidebar()"
    ></div>

    <!-- HEADER -->

    <header>
      <button
        class="menu-button"
        onclick="openSidebar()"
      >
        ☰
      </button>

      <img
        src="logo.png"
        alt="Logo HACKER F5"
        class="logo"
      />

      <div class="brand">
        <h1>HACKER F5</h1>

        <span>
          Assistant IA de cybersécurité responsable
        </span>
      </div>
    </header>

    <!-- MAIN -->

    <main>
      <section
        class="welcome"
        id="welcome"
      >
        <h2>👑 Bonjour</h2>

        <p>
          Je suis <strong>HACKER F5</strong>.<br />
          Comment puis-je t’aider aujourd’hui ?
        </p>
      </section>

      <section
        class="messages"
        id="messages"
      ></section>
    </main>

    <!-- INPUT -->

    <div class="input-area">
      <div class="input-container">

        <label for="fileInput">
          <span
            class="small-button"
            style="display:flex;align-items:center;justify-content:center;"
          >
            ＋
          </span>
        </label>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="*/*"
          onchange="handleFiles(event)"
        />

        <button
          class="small-button"
          onclick="prepareCreation()"
          title="Créer"
        >
          ✨
        </button>

        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Écris ton message..."
          rows="1"
          onkeydown="handleEnter(event)"
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>
    </div>
  </div>

  <script>
    const messagesContainer =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const welcome =
      document.getElementById("welcome");

    let conversation = [];

    let selectedFiles = [];

    let selectedLanguage =
      localStorage.getItem("hackerF5Language") ||
      "Français";

    const languageList = [
      "Français",
      "English",
      "Español",
      "Português",
      "Deutsch",
      "Italiano",
      "العربية",
      "中文",
      "日本語",
      "Русский",
      "Türkçe",
      "한국어",
      "हिन्दी",
      "Nederlands",
      "Polski",
      "Svenska",
      "Dansk",
      "Norsk",
      "Suomi",
      "Ελληνικά"
    ];

    function openSidebar() {
      document
        .getElementById("sidebar")
        .classList.add("active");

      document
        .getElementById("overlay")
        .classList.add("active");
    }

    function closeSidebar() {
      document
        .getElementById("sidebar")
        .classList.remove("active");

      document
        .getElementById("overlay")
        .classList.remove("active");
    }

    function addMessage(text, type = "ai") {
      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      messagesContainer.appendChild(message);

      window.scrollTo(
        0,
        document.body.scrollHeight
      );

      return message;
    }

    function handleEnter(event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    }

    function handleFiles(event) {
      selectedFiles =
        Array.from(event.target.files);

      if (selectedFiles.length === 0) {
        return;
      }

      const fileNames =
        selectedFiles
          .map(file => file.name)
          .join(", ");

      addMessage(
        "📎 Fichier(s) sélectionné(s) : " +
        fileNames,
        "system"
      );
    }

    function newConversation() {
      conversation = [];
      selectedFiles = [];

      messagesContainer.innerHTML = "";

      welcome.style.display = "block";

      messageInput.value = "";

      addMessage(
        "🆕 Nouvelle conversation créée.",
        "system"
      );

      closeSidebar();
    }

    function prepareCreation() {
      messageInput.value =
        "Je veux créer un contenu avec l’IA : ";

      messageInput.focus();

      addMessage(
        "✨ Décris ce que tu veux créer : image, logo, vidéo, document, musique ou autre.",
        "system"
      );

      closeSidebar();
    }

    function securityAnalysis() {
      messageInput.value =
        "Fais une analyse de sécurité responsable de : ";

      messageInput.focus();

      closeSidebar();
    }

    function codeAnalysis() {
      messageInput.value =
        "Analyse ce code et explique les erreurs ainsi que les corrections : ";

      messageInput.focus();

      closeSidebar();
    }

    function showHistory() {
      closeSidebar();

      const history =
        JSON.parse(
          localStorage.getItem("hackerF5History") ||
          "[]"
        );

      if (history.length === 0) {
        addMessage(
          "🕘 Aucun historique disponible pour le moment.",
          "system"
        );

        return;
      }

      let text =
        "🕘 HISTORIQUE DES CONVERSATIONS\n\n";

      history.forEach((item, index) => {
        text +=
          "⟐ " +
          (index + 1) +
          ". " +
          item.title +
          "\n";

        text +=
          "   🌐 Langue : " +
          (item.language || "Français") +
          "\n";

        text +=
          "   🕒 " +
          (item.date || "") +
          "\n\n";
      });

      addMessage(text, "system");
    }

    function showSettings() {
      closeSidebar();

      const currentLanguage =
        localStorage.getItem("hackerF5Language") ||
        "Français";

      const settingsBox =
        document.createElement("div");

      settingsBox.className =
        "settings-box";

      settingsBox.innerHTML = `
        <h3>⚙️ PARAMÈTRES HACKER F5</h3>

        <button
          class="settings-button"
          id="languageButton"
        >
          🌐 Language / Langue
        </button>

        <p class="language-status">
          Langue actuelle :
          <strong id="currentLanguage"></strong>
        </p>
      `;

      messagesContainer.appendChild(
        settingsBox
      );

      document.getElementById(
        "currentLanguage"
      ).textContent = currentLanguage;

      document
        .getElementById("languageButton")
        .addEventListener(
          "click",
          chooseLanguage
        );
    }

    function chooseLanguage() {
      const currentLanguage =
        localStorage.getItem("hackerF5Language") ||
        "Français";

      let choiceText =
        "🌐 CHOISIS LA LANGUE DE HACKER F5\n\n";

      languageList.forEach(
        (language, index) => {
          choiceText +=
            index +
            1 +
            ". " +
            language +
            "\n";
        }
      );

      choiceText +=
        "\nLangue actuelle : " +
        currentLanguage +
        "\n\nEntre le numéro de ton choix :";

      const choice =
        prompt(choiceText);

      if (choice === null) {
        return;
      }

      const number =
        Number(choice);

      if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > languageList.length
      ) {
        alert(
          "Choix invalide. Sélectionne un numéro entre 1 et 20."
        );

        return;
      }

      selectedLanguage =
        languageList[number - 1];

      localStorage.setItem(
        "hackerF5Language",
        selectedLanguage
      );

      addMessage(
        "🌐 Langue sélectionnée : " +
        selectedLanguage,
        "system"
      );

      alert(
        "La langue de HACKER F5 est maintenant : " +
        selectedLanguage
      );
    }

    function saveConversation() {
      if (conversation.length === 0) {
        return;
      }

      const firstUserMessage =
        conversation.find(
          message => message.role === "user"
        );

      const title =
        firstUserMessage
          ? firstUserMessage.content.substring(
              0,
              45
            )
          : "Nouvelle conversation";

      const history =
        JSON.parse(
          localStorage.getItem("hackerF5History") ||
          "[]"
        );

      history.unshift({
        title: title,
        language: selectedLanguage,
        date: new Date().toLocaleString()
      });

      localStorage.setItem(
        "hackerF5History",
        JSON.stringify(
          history.slice(0, 30)
        )
      );
    }

    function escapeHTML(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function createCopyButton(code) {
      const button =
        document.createElement("button");

      button.className =
        "copy-code-button";

      button.textContent =
        "📋 Copier le code";

      button.addEventListener(
        "click",
        async () => {
          try {
            await navigator.clipboard.writeText(
              code
            );

            button.textContent =
              "✅ Copié";

            setTimeout(() => {
              button.textContent =
                "📋 Copier le code";
            }, 1500);

          } catch (error) {
            const area =
              document.createElement("textarea");

            area.value = code;

            document.body.appendChild(area);

            area.select();

            document.execCommand("copy");

            area.remove();

            button.textContent =
              "✅ Copié";
          }
        }
      );

      return button;
    }

    function formatAIResponse(text) {
      const wrapper =
        document.createElement("div");

      wrapper.className =
        "ai-response";

      const copyAllArea =
        document.createElement("div");

      copyAllArea.className =
        "response-actions";

      const copyAllButton =
        document.createElement("button");

      copyAllButton.className =
        "copy-all-button";

      copyAllButton.textContent =
        "📋 Copier toute la réponse";

      copyAllButton.addEventListener(
