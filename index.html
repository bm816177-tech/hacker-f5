<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">

  <title>HACKER F5 👑</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    /* =========================
       APP
    ========================= */

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top, rgba(255, 0, 0, 0.12), transparent 35%),
        #050505;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #202020;
      background: rgba(5, 5, 5, 0.96);
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid #292929;
      border-radius: 12px;
      background: #101010;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #ff0000, #700000);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
      font-size: 22px;
    }

    .brand h1 {
      font-size: 17px;
      letter-spacing: 1px;
    }

    .brand span {
      font-size: 10px;
      color: #888;
    }

    .new-btn {
      border: 1px solid #333;
      background: #111;
      color: white;
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 13px 145px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 65px 20px 20px;
    }

    .welcome-logo {
      font-size: 55px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.5));
    }

    .welcome h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #999;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      display: flex;
      margin: 12px 0;
      animation: messageIn 0.25s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 17px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #8d0000;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #111;
      border: 1px solid #242424;
      border-bottom-left-radius: 5px;
    }

    .ai-name {
      color: #ff3333;
      font-size: 11px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    /* =========================
       ACTION STATUS
    ========================= */

    .status-card {
      display: none;
      max-width: 88%;
      margin: 10px 0;
      padding: 12px 14px;
      background: #0d0d0d;
      border: 1px solid #292929;
      border-radius: 14px;
      animation: statusIn 0.3s ease;
    }

    .status-card.active {
      display: block;
    }

    @keyframes statusIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    .status-detail {
      color: #888;
      font-size: 11px;
      margin-top: 5px;
      margin-left: 28px;
    }

    .loader {
      width: 17px;
      height: 17px;
      border: 2px solid #333;
      border-top-color: #ff1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .done-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #b00000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 2px 12px;
      scrollbar-width: none;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      flex-shrink: 0;
      background: #101010;
      border: 1px solid #282828;
      color: #ddd;
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .quick-btn:active {
      transform: scale(0.96);
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 10px 12px;
      background: linear-gradient(
        to top,
        #050505 75%,
        transparent
      );
      z-index: 20;
    }

    .composer {
      max-width: 800px;
      margin: auto;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 8px;
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      padding: 11px 5px;
      font-size: 14px;
    }

    .composer textarea::placeholder {
      color: #666;
    }

    .icon-btn {
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      border: 1px solid #292929;
      border-radius: 12px;
      background: #151515;
      color: #ddd;
      cursor: pointer;
      font-size: 17px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 13px;
      background: linear-gradient(145deg, #ff1a1a, #850000);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    /* =========================
       SIDE MENU
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      z-index: 50;
    }

    .overlay.open {
      display: block;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100vh;
      background: #090909;
      border-right: 1px solid #252525;
      z-index: 60;
      transition: left 0.25s ease;
      padding: 18px;
      overflow-y: auto;
    }

    .side-menu.open {
      left: 0;
    }

    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .side-title {
      font-size: 18px;
      font-weight: bold;
    }

    .close-btn {
      background: #151515;
      color: white;
      border: 1px solid #292929;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .menu-section {
      margin-top: 20px;
    }

    .menu-label {
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
      margin: 0 0 8px 5px;
      letter-spacing: 1px;
    }

    .menu-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: #ddd;
      padding: 12px;
      border-radius: 11px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .menu-item:hover {
      background: #151515;
      border-color: #292929;
    }

    /* =========================
       FILE
    ========================= */

    #fileInput {
      display: none;
    }

    .file-preview {
      display: none;
      margin: 5px auto;
      max-width: 800px;
      background: #111;
      border: 1px solid #292929;
      padding: 9px;
      border-radius: 12px;
      font-size: 12px;
      color: #aaa;
    }

    .file-preview.active {
      display: block;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .brand h1 {
        font-size: 15px;
      }

      .new-btn {
        font-size: 11px;
        padding: 8px;
      }

      .welcome {
        padding-top: 45px;
      }

      .bubble {
        max-width: 92%;
      }

      .status-card {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header>

    <div class="header-left">

      <button
        class="menu-btn"
        onclick="openMenu()">
        ☰
      </button>

      <div class="logo">
        👑
      </div>

      <div class="brand">
        <h1>HACKER F5</h1>
        <span>IA • CYBERSÉCURITÉ • CRÉATION</span>
      </div>

    </div>

    <button
      class="new-btn"
      onclick="newConversation()">
      ＋ Nouveau
    </button>

  </header>


  <!-- CHAT -->
  <main id="chat">

    <div id="welcome" class="welcome">

      <div class="welcome-logo">
        👑
      </div>

      <h2>HACKER F5</h2>

      <p>
        Assistant IA intelligent pour le numérique,
        la programmation, la cybersécurité défensive,
        la création et l'analyse de fichiers.
      </p>

    </div>


    <!-- STATUS -->
    <div id="statusCard" class="status-card">

      <div class="status-title">

        <div id="statusLoader" class="loader"></div>

        <span id="statusTitle">
          Analyse en cours…
        </span>

      </div>

      <div id="statusDetail" class="status-detail">
        HACKER F5 traite votre demande.
      </div>

    </div>

  </main>


  <!-- FILE PREVIEW -->
  <div id="filePreview" class="file-preview"></div>


  <!-- COMPOSER -->
  <div class="composer-area">

    <!-- QUICK ACTIONS -->
    <div class="quick-actions">

      <button
        class="quick-btn"
        onclick="useMode('web')">
        🌐 Recherche Web
      </button>

      <button
        class="quick-btn"
        onclick="useMode('code')">
        💻 Code
      </button>

      <button
        class="quick-btn"
        onclick="useMode('cyber')">
        🛡️ Cyber
      </button>

      <button
        class="quick-btn"
        onclick="useMode('decode')">
        🔐 Décoder
      </button>

      <button
        class="quick-btn"
        onclick="useMode('document')">
        📄 Document
      </button>

      <button
        class="quick-btn"
        onclick="useMode('image')">
        🖼️ Image
      </button>

      <button
        class="quick-btn"
        onclick="useMode('video')">
        🎬 Vidéo
      </button>

      <button
        class="quick-btn"
        onclick="useMode('music')">
        🎵 Chanson
      </button>

    </div>


    <div class="composer">

      <input
        id="fileInput"
        type="file"
        multiple
        onchange="selectFile(event)"
      >

      <button
        class="icon-btn"
        onclick="document.getElementById('fileInput').click()"
        title="Fichier">
        📎
      </button>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message à HACKER F5…"
        onkeydown="handleKey(event)"
      ></textarea>

      <button
        class="icon-btn"
        onclick="startVoice()"
        title="Voix">
        🎙️
      </button>

      <button
        class="send-btn"
        onclick="sendMessage()"
        title="Envoyer">
        ➤
      </button>

    </div>

  </div>


  <!-- SIDE MENU -->
  <div
    id="overlay"
    class="overlay"
    onclick="closeMenu()">
  </div>

  <aside
    id="sideMenu"
    class="side-menu">

    <div class="side-header">

      <div class="side-title">
        👑 HACKER F5
      </div>

      <button
        class="close-btn"
        onclick="closeMenu()">
        ✕
      </button>

    </div>


    <div class="menu-section">

      <div class="menu-label">
        Conversation
      </div>

      <button
        class="menu-item"
        onclick="newConversation()">
        🆕 Nouvelle conversation
      </button>

      <button
        class="menu-item"
        onclick="showHistory()">
        🗂️ Historique
      </button>

    </div>


    <div class="menu-section">

      <div class="menu-label">
        Intelligence
      </div>

      <button
        class="menu-item"
        onclick="useMode('web')">
        🌐 Recherche Web
      </button>

      <button
        class="menu-item"
        onclick="useMode('code')">
        💻 Programmation
      </button>

      <button
        class="menu-item"
        onclick="useMode('cyber')">
        🛡️ Cybersécurité défensive
      </button>

      <button
        class="menu-item"
        onclick="useMode('decode')">
        🔐 Décodage / analyse
      </button>

    </div>


    <div class="menu-section">

      <div class="menu-label">
        Création
      </div>

      <button
        class="menu-item"
        onclick="useMode('document')">
        📄 Documents
      </button>

      <button
        class="menu-item"
        onclick="useMode('image')">
        🖼️ Images
      </button>

      <button
        class="menu-item"
        onclick="useMode('video')">
        🎬 Vidéos
      </button>

      <button
        class="menu-item"
        onclick="useMode('music')">
        🎵 Chansons / musique
      </button>

    </div>


    <div class="menu-section">

      <div class="menu-label">
        Compte
      </div>

      <button
        class="menu-item"
        onclick="accountInfo()">
        👤 Mon compte
      </button>

      <button
        class="menu-item"
        onclick="settings()">
        ⚙️ Paramètres
      </button>

    </div>

  </aside>

</div>


<script>

  /* =========================
     VARIABLES
  ========================= */

  let conversationMessages = [];

  let currentMode = "normal";

  let selectedFiles = [];


  /* =========================
     ELEMENTS
  ========================= */

  const chat = document.getElementById("chat");

  const input = document.getElementById("messageInput");

  const statusCard = document.getElementById("statusCard");

  const statusTitle = document.getElementById("statusTitle");

  const statusDetail = document.getElementById("statusDetail");

  const statusLoader = document.getElementById("statusLoader");

  const welcome = document.getElementById("welcome");

  const filePreview = document.getElementById("filePreview");


  /* =========================
     STATUS
  ========================= */

  function showStatus(title, detail) {

    statusCard.classList.add("active");

    statusLoader.className = "loader";

    statusTitle.textContent = title;

    statusDetail.textContent = detail;

    scrollChat();
  }


  function updateStatus(title, detail) {

    statusTitle.textContent = title;

    statusDetail.textContent = detail;

    scrollChat();
  }


  function finishStatus() {

    statusLoader.className = "done-icon";

    statusLoader.textContent = "✓";

    statusTitle.textContent = "Terminé";

    statusDetail.textContent =
      "HACKER F5 a terminé le traitement.";

    setTimeout(() => {

      statusCard.classList.remove("active");

      statusLoader.className = "loader";

      statusLoader.textContent = "";

    }, 1200);

  }


  /* =========================
     MODE
  ========================= */

  function useMode(mode) {

    currentMode = mode;

    const modes = {

      web:
        "🌐 Recherche Web : que veux-tu que je recherche ?",

      code:
        "💻 Programmation : envoie ton code ou explique ton problème.",

      cyber:
        "🛡️ Cybersécurité : décris ton problème de sécurité ou ton environnement autorisé.",

      decode:
        "🔐 Décodage : envoie le texte ou les données à analyser.",

      document:
        "📄 Document : indique le type de document que tu veux créer.",

      image:
        "🖼️ Image : décris l'image que tu veux créer.",

      video:
        "🎬 Vidéo : décris la vidéo que tu veux créer.",

      music:
        "🎵 Chanson : décris le style et le contenu souhaités.",

      normal:
        "Que puis-je faire pour toi ?"

    };

    input.value = modes[mode] || modes.normal;

    input.focus();

  }


  /* =========================
     SEND MESSAGE
  ========================= */

  async function sendMessage() {

    const text = input.value.trim();

    if (!text && selectedFiles.length === 0) {
      return;
    }

    welcome.style.display = "none";

    addMessage(
      "user",
      text || "📎 Fichier envoyé"
    );

    input.value = "";

    autoResize();


    conversationMessages.push({
      role: "user",
      content: text
    });


    let statusTitleText =
      "🧠 Analyse de la demande…";

    let statusDetailText =
      "HACKER F5 prépare la réponse.";


    if (currentMode === "web") {

      statusTitleText =
        "🌐 Recherche sur le Web…";

      statusDetailText =
        "Recherche et analyse des informations disponibles.";

    }

    else if (currentMode === "code") {

      statusTitleText =
        "💻 Analyse du code…";

      statusDetailText =
        "HACKER F5 examine le code et prépare une solution.";

    }

    else if (currentMode === "cyber") {

      statusTitleText =
        "🛡️ Analyse cybersécurité…";

      statusDetailText =
        "Analyse défensive de la demande.";

    }

    else if (currentMode === "decode") {

      statusTitleText =
        "🔐 Analyse du contenu…";

      statusDetailText =
        "Identification du format et analyse des données.";

    }

    else if (currentMode === "document") {

      statusTitleText =
        "📄 Préparation du document…";

      statusDetailText =
        "Préparation du contenu demandé.";

    }

    else if (currentMode === "image") {

      statusTitleText =
        "🖼️ Préparation de l'image…";

      statusDetailText =
        "Préparation de la demande de génération.";

    }

    else if (currentMode === "video") {

      statusTitleText =
        "🎬 Préparation de la vidéo…";

      statusDetailText =
        "Préparation de la demande vidéo.";

    }

    else if (currentMode === "music") {

      statusTitleText =
        "🎵 Préparation de la chanson…";

      statusDetailText =
        "Préparation de la demande musicale.";

    }


    showStatus(
      statusTitleText,
      statusDetailText
    );


    try {

      if (currentMode === "web") {

        await delay(500);

        updateStatus(
          "🔎 Recherche en cours…",
          "HACKER F5 interroge son moteur de recherche."
        );

        await delay(500);

        updateStatus(
          "📚 Analyse des informations…",
          "Les informations sont en cours d'analyse."
        );

      }

      else {

        await delay(400);

        updateStatus(
          "🧠 Génération de la réponse…",
          "HACKER F5 traite votre demande."
        );

      }


      const response = await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

                    body: JSON.stringify({
            messages: conversationMessages,
            mode: currentMode
          })
        }
      );


      const data = await response.json();


      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          "Erreur du serveur"
        );

      }


      updateStatus(
        "✅ Réponse prête",
        "HACKER F5 a terminé l'analyse."
      );


      const answer =
        data.answer ||
        "Je n'ai reçu aucune réponse texte.";


      addMessage(
        "ai",
        answer
      );


      conversationMessages.push({
        role: "assistant",
        content: answer
      });


      saveLocalHistory();


      setTimeout(
        finishStatus,
        500
      );


    }

    catch (error) {

      statusLoader.className = "done-icon";

      statusLoader.textContent = "⚠";

      statusTitle.textContent =
        "Erreur";

      statusDetail.textContent =
        error.message ||
        "Une erreur est survenue.";

      addMessage(
        "ai",
        "⚠️ Une erreur est survenue :\n" +
        (error.message || "Erreur inconnue.")
      );

    }

  }


  /* =========================
     ADD MESSAGE
  ========================= */

  function addMessage(type, text) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " + type;


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    if (type === "ai") {

      const name =
        document.createElement("div");

      name.className =
        "ai-name";

      name.textContent =
        "👑 HACKER F5";

      bubble.appendChild(name);

    }


    const content =
      document.createElement("div");

    content.textContent = text;


    bubble.appendChild(content);

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    scrollChat();

  }


  /* =========================
     FILES
  ========================= */

  function selectFile(event) {

    selectedFiles =
      Array.from(event.target.files);


    if (selectedFiles.length === 0) {

      filePreview.classList.remove("active");

      return;

    }


    filePreview.classList.add("active");


    filePreview.textContent =
      "📎 " +
      selectedFiles.length +
      " fichier(s) sélectionné(s) : " +
      selectedFiles
        .map(file => file.name)
        .join(", ");

  }


  /* =========================
     VOICE
  ========================= */

  function startVoice() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      alert(
        "La reconnaissance vocale n'est pas disponible sur ce navigateur."
      );

      return;

    }


    const recognition =
      new SpeechRecognition();


    recognition.lang =
      "fr-FR";

    recognition.interimResults =
      false;

    recognition.continuous =
      false;


    showStatus(
      "🎙️ Écoute en cours…",
      "Parle maintenant."
    );


    recognition.start();


    recognition.onresult =
      function(event) {

        const text =
          event.results[0][0].transcript;

        input.value = text;

        autoResize();

        statusCard.classList.remove(
          "active"
        );

      };


    recognition.onerror =
      function() {

        statusCard.classList.remove(
          "active"
        );

      };

  }


  /* =========================
     NEW CONVERSATION
  ========================= */

  function newConversation() {

    conversationMessages = [];

    currentMode = "normal";

    selectedFiles = [];

    chat.innerHTML = "";

    chat.appendChild(welcome);

    welcome.style.display = "block";

    filePreview.classList.remove(
      "active"
    );

    input.value = "";

    closeMenu();

  }


  /* =========================
     HISTORY
  ========================= */

  function saveLocalHistory() {

    try {

      localStorage.setItem(
        "hackerF5_history",
        JSON.stringify(
          conversationMessages
        )
      );

    }

    catch (error) {

      console.log(
        "Historique local indisponible."
      );

    }

  }


  function showHistory() {

    closeMenu();

    const history =
      localStorage.getItem(
        "hackerF5_history"
      );


    if (!history) {

      alert(
        "Aucune conversation enregistrée."
      );

      return;

    }


    const messages =
      JSON.parse(history);


    chat.innerHTML = "";

    welcome.style.display = "none";


    messages.forEach(message => {

      addMessage(
        message.role === "user"
          ? "user"
          : "ai",
        message.content
      );

    });

  }


  /* =========================
     ACCOUNT
  ========================= */

  function accountInfo() {

    closeMenu();

    alert(
      "👤 Compte HACKER F5\n\n" +
      "La connexion Supabase pourra être activée ici."
    );

  }


  /* =========================
     SETTINGS
  ========================= */

  function settings() {

    closeMenu();

    alert(
      "⚙️ Paramètres HACKER F5\n\n" +
      "Les réglages avancés seront disponibles ici."
    );

  }


  /* =========================
     MENU
  ========================= */

  function openMenu() {

    document
      .getElementById("sideMenu")
      .classList.add("open");

    document
      .getElementById("overlay")
      .classList.add("open");

  }


  function closeMenu() {

    document
      .getElementById("sideMenu")
      .classList.remove("open");

    document
      .getElementById("overlay")
      .classList.remove("open");

  }


  /* =========================
     KEYBOARD
  ========================= */

  function handleKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }


  /* =========================
     TEXTAREA
  ========================= */

  input.addEventListener(
    "input",
    autoResize
  );


  function autoResize() {

    input.style.height = "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }


  /* =========================
     HELPERS
  ========================= */

  function scrollChat() {

    setTimeout(() => {

      chat.scrollTop =
        chat.scrollHeight;

    }, 50);

  }


  function delay(ms) {

    return new Promise(
      resolve => setTimeout(resolve, ms)
    );

  }


  /* =========================
     OVERLAY
  ========================= */

  document
    .getElementById("overlay")
    .addEventListener(
      "click",
      function(event) {

        if (event.target === this) {

          closeMenu();

        }

      }
    );


</script>

</body>
</html>
