<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HACKER F5 AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #eeeeee;
      color: #171717;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 65px;
      background: #ffffff;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #000000;
      color: #ffffff;
      font-size: 27px;
      font-weight: bold;
      line-height: 1;
    }

    .menu-button:hover {
      background: #222222;
    }

    .logo {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c40000;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand h1 {
      font-size: 20px;
      color: #b40000;
      letter-spacing: 1px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 900;
    }

    .brand span {
      font-size: 11px;
      color: #666666;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100vh;
      background: #ffffff;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
      z-index: 30;
      padding: 20px 15px;
      transition: left 0.25s ease;
      overflow-y: auto;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .sidebar-top h2 {
      color: #b40000;
      font-size: 20px;
      font-weight: 900;
    }

    .close-sidebar {
      border: none;
      background: #eeeeee;
      width: 35px;
      height: 35px;
      border-radius: 10px;
      font-size: 20px;
    }

    .side-button {
      width: 100%;
      border: none;
      background: #f3f3f3;
      color: #222222;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
    }

    .side-button:hover {
      background: #ffe3e3;
      color: #b40000;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 20;
    }

    .overlay.active {
      display: block;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 20px 15px 150px;
    }

    .welcome {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px 20px;
      text-align: center;
      border: 1px solid #dddddd;
      margin-bottom: 20px;
    }

    .welcome h2 {
      color: #b40000;
      margin-bottom: 10px;
      font-size: 24px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 900;
    }

    .welcome p {
      color: #555555;
      line-height: 1.5;
      font-size: 14px;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 94%;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
      background: #b40000;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .message.ai {
      align-self: flex-start;
      background: #ffffff;
      color: #202020;
      border: 1px solid #dddddd;
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    .message.system {
      align-self: center;
      background: #fff3f3;
      color: #8d0000;
      font-size: 13px;
      text-align: center;
      white-space: pre-wrap;
    }

    .typing {
      color: #777777;
      font-style: italic;
    }

    /* =========================
       STYLE HACKER
    ========================= */

    .ai-response {
      width: 100%;
    }

    .hacker-title {
      color: #b40000;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.5px;
      margin: 10px 0;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .hacker-line {
      color: #b40000;
      font-weight: bold;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .hacker-symbol {
      color: #b40000;
      font-weight: bold;
    }

    .ai-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .styled-normal {
      line-height: 1.7;
    }

    /* =========================
       CODE
    ========================= */

    .code-wrapper {
      width: 100%;
      margin: 12px 0;
      border-radius: 12px;
      overflow: hidden;
      background: #171717;
      border: 1px solid #444444;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      background: #292929;
      color: #ffffff;
      font-size: 12px;
    }

    .code-language {
      color: #ff7777;
      font-weight: bold;
    }

    .copy-code-button,
    .copy-all-button {
      border: none;
      border-radius: 8px;
      background: #b40000;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 12px;
    }

    .copy-code-button:hover,
    .copy-all-button:hover {
      background: #e00000;
    }

    .code-content {
      padding: 14px;
      overflow-x: auto;
      color: #eeeeee;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
    }

    .response-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .tools-panel {
      background: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 12px;
      display: none;
    }

    .tools-panel.active {
      display: block;
    }

    .tools-title {
      color: #b40000;
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 9px;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .tool-button {
      min-height: 48px;
      border: none;
      border-radius: 11px;
      background: #f2f2f2;
      color: #222222;
      padding: 7px 4px;
      font-size: 11px;
      line-height: 1.2;
    }

    .tool-button:hover {
      background: #ffe1e1;
      color: #b40000;
    }

    .tool-icon {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }

    /* =========================
       FILE PREVIEW
    ========================= */

    .file-preview {
      display: none;
      background: #fff3f3;
      border: 1px solid #f0caca;
      border-radius: 12px;
      padding: 9px;
      margin-bottom: 8px;
    }

    .file-preview.active {
      display: block;
    }

    .file-preview-title {
      color: #b40000;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      padding: 5px 0;
      border-bottom: 1px solid #f0dede;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .remove-file {
      border: none;
      background: transparent;
      color: #b40000;
      font-size: 16px;
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      border-top: 1px solid #dddddd;
      padding: 8px 10px;
      z-index: 15;
    }

    .input-container {
      max-width: 950px;
      margin: auto;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    /* BOUTON + NOIR */

    .small-button {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: #000000;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
    }

    .small-button:hover {
      background: #222222;
    }

    .message-input {
      flex: 1;
      min-height: 43px;
      max-height: 130px;
      resize: none;
      border: 1px solid #cccccc;
      border-radius: 13px;
      padding: 12px;
      outline: none;
      background: #ffffff;
      color: #111111;
    }

    .message-input:focus {
      border-color: #b40000;
    }

    .send-button {
      width: 48px;
      height: 43px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: #b40000;
      color: #ffffff;
      font-size: 20px;
    }

    .send-button:hover {
      background: #e00000;
    }

    .send-button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-box {
      background: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 16px;
      padding: 18px;
      margin-top: 15px;
    }

    .settings-box h3 {
      color: #b40000;
      margin-bottom: 10px;
    }

    .settings-button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #f0f0f0;
      text-align: left;
      color: #222222;
    }

    .settings-button:hover {
      background: #ffe1e1;
      color: #b40000;
    }

    .language-status {
      margin-top: 10px;
      color: #666666;
      font-size: 13px;
    }

    .history-item {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .history-item:hover {
      background: #ffe3e3;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 700px) {
      .sidebar {
        left: 0;
        position: fixed;
      }

      .sidebar.active {
        left: 0;
      }

      .overlay {
        display: none !important;
      }

      main {
        margin-left: 280px;
        max-width: calc(100% - 280px);
      }

      header {
        margin-left: 280px;
      }

      .input-area {
        left: 280px;
      }

      .menu-button {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .tools-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .tool-button {
        font-size: 10px;
      }

      .tool-icon {
        font-size: 18px;
      }
    }

    @media (max-width: 450px) {
      .brand h1 {
        font-size: 17px;
      }

      .brand span {
        font-size: 10px;
      }

      .message {
        max-width: 100%;
        font-size: 14px;
      }

      .welcome h2 {
        font-size: 21px;
      }

      .code-content {
        font-size: 12px;
      }

      .tools-grid {
        gap: 5px;
      }

      .small-button {
        width: 40px;
      }

      .send-button {
        width: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">
        <h2>👑 HACKER F5</h2>

        <button
          class="close-sidebar"
          onclick="closeSidebar()"
        >
          ×
        </button>
      </div>

      <button
        class="side-button"
        onclick="newConversation()"
      >
        ➕ Nouvelle conversation
      </button>

      <button
        class="side-button"
        onclick="showHistory()"
      >
        🕘 Historique
      </button>

      <button
        class="side-button"
        onclick="prepareCreation()"
      >
        ✨ Créer avec l’IA
      </button>

      <button
        class="side-button"
        onclick="securityAnalysis()"
      >
        🛡️ Analyse sécurité
      </button>

      <button
        class="side-button"
        onclick="codeAnalysis()"
      >
        💻 Analyse de code
      </button>

      <button
        class="side-button"
        onclick="showSettings()"
      >
        ⚙️ Paramètres
      </button>

    </aside>

    <div
      class="overlay"
      id="overlay"
      onclick="closeSidebar()"
    ></div>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

      <button
        class="menu-button"
        onclick="openSidebar()"
        title="Menu"
      >
        =
      </button>

      <img
        src="logo.png"
        alt="Logo HACKER F5"
        class="logo"
      />

      <div class="brand">

        <h1>HACKER F5</h1>

        <span>
          Assistant IA de cybersécurité responsable
        </span>

      </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>

      <section
        class="welcome"
        id="welcome"
      >

        <h2>👑 Bonjour</h2>

        <p>
          Je suis <strong>HACKER F5</strong>.<br />
          Comment puis-je t’aider aujourd’hui ?
        </p>

      </section>

      <section
        class="messages"
        id="messages"
      ></section>

    </main>


    <!-- =========================
         INPUT AREA
    ========================== -->

    <div class="input-area">

      <div class="input-container">

        <!-- TOOLS -->

        <div
          class="tools-panel"
          id="toolsPanel"
        >

          <div class="tools-title">
            ⟐ OUTILS HACKER F5
          </div>

          <div class="tools-grid">

            <button
              class="tool-button"
              onclick="openFiles()"
            >
              <span class="tool-icon">📎</span>
              Fichiers
            </button>

            <button
              class="tool-button"
              onclick="prepareImage()"
            >
              <span class="tool-icon">🖼️</span>
              Image
            </button>

            <button
              class="tool-button"
              onclick="startVoice()"
            >
              <span class="tool-icon">🎙️</span>
              Voix
            </button>

            <button
              class="tool-button"
              onclick="prepareDocument()"
            >
              <span class="tool-icon">📄</span>
              Document
            </button>

            <button
              class="tool-button"
              onclick="prepareImageGeneration()"
            >
              <span class="tool-icon">🎨</span>
              Générer
            </button>

            <button
              class="tool-button"
              onclick="preparePresentation()"
            >
              <span class="tool-icon">📊</span>
              Présentation
            </button>

            <button
              class="tool-button"
              onclick="prepareTable()"
            >
              <span class="tool-icon">📋</span>
              Tableau
            </button>

            <button
              class="tool-button"
              onclick="prepareWebSearch()"
            >
              <span class="tool-icon">🌐</span>
              Recherche
            </button>

          </div>

        </div>


        <!-- FILE PREVIEW -->

        <div
          class="file-preview"
          id="filePreview"
        >

          <div class="file-preview-title">
            📎 Fichiers sélectionnés
          </div>

          <div id="fileList"></div>

        </div>


        <!-- INPUT ROW -->

        <div class="input-row">

          <!-- BOUTON + -->

          <button
            class="small-button"
            id="plusButton"
            onclick="toggleTools()"
            title="Outils"
          >
            +
          </button>

          <!-- FICHIER -->

          <button
            class="small-button"
            onclick="openFiles()"
            title="Ajouter un fichier"
          >
            📎
          </button>

          <input
            type="file"
            id="fileInput"
            multiple
            accept="*/*"
            onchange="handleFiles(event)"
          />

          <!-- MESSAGE -->

          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Écris ton message..."
            rows="1"
          ></textarea>

          <!-- ENVOI -->

          <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
            title="Envoyer"
          >
            ➤
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       VARIABLES
    ========================= */

    const messagesContainer =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const welcome =
      document.getElementById("welcome");

    const toolsPanel =
      document.getElementById("toolsPanel");

    const filePreview =
      document.getElementById("filePreview");

    const fileList =
      document.getElementById("fileList");

    let conversation = [];

    let selectedFiles = [];

    let selectedLanguage =
      localStorage.getItem("hackerF5Language") ||
      "Français";


    /* =========================
       LANGUES
    ========================== */

    const languageList = [
      "Français",
      "English",
      "Español",
      "Português",
      "Deutsch",
      "Italiano",
      "العربية",
      "中文",
      "日本語",
      "Русский",
      "Türkçe",
      "한국어",
      "हिन्दी",
      "Nederlands",
      "Polski",
      "Svenska",
      "Dansk",
      "Norsk",
      "Suomi",
      "Ελληνικά"
    ];


    /* =========================
       SIDEBAR
    ========================== */

    function openSidebar() {
      document
        .getElementById("sidebar")
        .classList.add("active");

      document
        .getElementById("overlay")
        .classList.add("active");
    }


    function closeSidebar() {
      document
        .getElementById("sidebar")
        .classList.remove("active");

      document
        .getElementById("overlay")
        .classList.remove("active");
    }


    /* =========================
       TOOLS
    ========================== */

    function toggleTools() {

      toolsPanel.classList.toggle("active");

    }


    function closeTools() {

      toolsPanel.classList.remove("active");

    }


    /* =========================
       MESSAGES
    ========================== */

    function addMessage(text, type = "ai") {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      messagesContainer.appendChild(message);

      scrollToBottom();

      return message;
    }


    function scrollToBottom() {

      setTimeout(() => {

        window.scrollTo({
                    top: document.body.scrollHeight,
          behavior: "smooth"
        });

      }, 50);
    }


    /* =========================
       ENTRÉE CLAVIER
    ========================= */

    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    });


    /* =========================
       REDIMENSIONNEMENT DU TEXTE
    ========================= */

    messageInput.addEventListener("input", function() {

      this.style.height = "auto";

      this.style.height =
        Math.min(this.scrollHeight, 130) + "px";

    });


    /* =========================
       FICHIERS
    ========================= */

    function openFiles() {

      document
        .getElementById("fileInput")
        .click();

    }


    function handleFiles(event) {

      const files =
        Array.from(event.target.files || []);

      if (!files.length) {
        return;
      }

      selectedFiles =
        selectedFiles.concat(files);

      renderFiles();

      closeTools();

    }


    function renderFiles() {

      fileList.innerHTML = "";

      if (!selectedFiles.length) {

        filePreview.classList.remove("active");

        return;
      }

      filePreview.classList.add("active");

      selectedFiles.forEach((file, index) => {

        const item =
          document.createElement("div");

        item.className = "file-item";

        const name =
          document.createElement("span");

        name.textContent =
          "📎 " + file.name;

        const remove =
          document.createElement("button");

        remove.className = "remove-file";

        remove.textContent = "×";

        remove.onclick = function() {

          removeFile(index);

        };

        item.appendChild(name);
        item.appendChild(remove);

        fileList.appendChild(item);

      });

    }


    function removeFile(index) {

      selectedFiles.splice(index, 1);

      renderFiles();

    }


    /* =========================
       EXTRAIRE LA RÉPONSE DE L'IA
    ========================= */

    function extractAIText(result) {

      if (!result) {
        return "";
      }


      if (typeof result === "string") {
        return result;
      }


      if (
        result.outputs &&
        Array.isArray(result.outputs)
      ) {

        for (const output of result.outputs) {

          if (
            typeof output === "string" &&
            output.trim()
          ) {

            return output;

          }

          if (
            output &&
            typeof output.content === "string"
          ) {

            return output.content;

          }

          if (
            output &&
            Array.isArray(output.content)
          ) {

            const text =
              output.content
                .map(item => {

                  if (typeof item === "string") {
                    return item;
                  }

                  return item?.text || "";

                })
                .join("");

            if (text.trim()) {
              return text;
            }

          }

        }

      }


      if (
        result.output &&
        Array.isArray(result.output)
      ) {

        for (const output of result.output) {

          if (
            typeof output?.content === "string"
          ) {

            return output.content;

          }

        }

      }


      if (
        result.choices &&
        Array.isArray(result.choices) &&
        result.choices[0]
      ) {

        const choice =
          result.choices[0];

        if (
          choice.message &&
          typeof choice.message.content === "string"
        ) {

          return choice.message.content;

        }

        if (
          typeof choice.text === "string"
        ) {

          return choice.text;

        }

      }


      if (
        typeof result.content === "string"
      ) {

        return result.content;

      }


      if (
        typeof result.text === "string"
      ) {

        return result.text;

      }


      return "";

    }


    /* =========================
       AFFICHAGE DE LA RÉPONSE IA
    ========================= */

    function renderAIResponse(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "ai-response";


      const copyAll =
        document.createElement("button");

      copyAll.className =
        "copy-all-button";

      copyAll.textContent =
        "📋 Copier";

      copyAll.onclick = function() {

        copyText(text);

      };


      const actions =
        document.createElement("div");

      actions.className =
        "response-actions";

      actions.appendChild(copyAll);


      const codeRegex =
        /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;

      let lastIndex = 0;

      let match;


      while (
        (match = codeRegex.exec(text)) !== null
      ) {

        const normalText =
          text.slice(
            lastIndex,
            match.index
          );

        if (normalText.trim()) {

          const normal =
            document.createElement("div");

          normal.className =
            "ai-text styled-normal";

          normal.textContent =
            normalText;

          wrapper.appendChild(normal);

        }


        const language =
          match[1] || "code";

        const code =
          match[2].replace(/^\n/, "").replace(/\n$/, "");


        const codeWrapper =
          document.createElement("div");

        codeWrapper.className =
          "code-wrapper";


        const codeHeader =
          document.createElement("div");

        codeHeader.className =
          "code-header";


        const languageLabel =
          document.createElement("span");

        languageLabel.className =
          "code-language";

        languageLabel.textContent =
          language;


        const copyButton =
          document.createElement("button");

        copyButton.className =
          "copy-code-button";

        copyButton.textContent =
          "Copier";

        copyButton.onclick = function() {

          copyText(code);

        };


        codeHeader.appendChild(
          languageLabel
        );

        codeHeader.appendChild(
          copyButton
        );


        const codeContent =
          document.createElement("div");

        codeContent.className =
          "code-content";

        codeContent.textContent =
          code;


        codeWrapper.appendChild(
          codeHeader
        );

        codeWrapper.appendChild(
          codeContent
        );

        wrapper.appendChild(
          codeWrapper
        );


        lastIndex =
          codeRegex.lastIndex;

      }


      const remaining =
        text.slice(lastIndex);


      if (remaining.trim()) {

        const normal =
          document.createElement("div");

        normal.className =
          "ai-text styled-normal";

        normal.textContent =
          remaining;

        wrapper.appendChild(normal);

      }


      wrapper.appendChild(actions);


      return wrapper;

    }


    /* =========================
       COPIE
    ========================= */

    async function copyText(text) {

      try {

        await navigator.clipboard.writeText(text);

        addMessage(
          "📋 Texte copié dans le presse-papiers.",
          "system"
        );

      } catch (error) {

        addMessage(
          "⚠️ Impossible de copier automatiquement le texte.",
          "system"
        );

      }

    }


    /* =========================
       ENVOYER LE MESSAGE
    ========================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text && !selectedFiles.length) {

        return;

      }


      let finalMessage = text;


      if (selectedFiles.length) {

        const fileNames =
          selectedFiles
            .map(file => file.name)
            .join(", ");

        finalMessage +=
          (finalMessage ? "\n\n" : "") +
          "📎 Fichiers sélectionnés : " +
          fileNames;

      }


      addMessage(
        finalMessage,
        "user"
      );


      conversation.push({
        role: "user",
        content: finalMessage
      });


      messageInput.value = "";

      messageInput.style.height = "auto";


      const filesToReset =
        selectedFiles.length;

      selectedFiles = [];

      renderFiles();


      closeTools();


      welcome.style.display = "none";


      sendButton.disabled = true;

      sendButton.textContent = "…";


      const typing =
        addMessage(
          "⚡ HACKER F5 analyse votre demande...",
          "ai"
        );

      typing.classList.add("typing");


      try {

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              messages: conversation,

              language: selectedLanguage

            })

          });


        let result;

        try {

          result =
            await response.json();

        } catch (jsonError) {

          throw new Error(
            "La réponse du serveur n'est pas un JSON valide."
          );

        }


        if (!response.ok) {

          const serverError =
            result?.error;

          let errorText =
            "Une erreur est survenue avec le serveur.";

          if (
            typeof serverError === "string"
          ) {

            errorText =
              serverError;

          } else if (
            serverError
          ) {

            errorText =
              JSON.stringify(
                serverError,
                null,
                2
              );

          }

          throw new Error(errorText);

        }


        const aiText =
          extractAIText(result);


        if (!aiText.trim()) {

          throw new Error(
            "HACKER F5 n'a pas renvoyé de texte."
          );

        }


        typing.remove();


        const aiMessage =
          document.createElement("div");

        aiMessage.className =
          "message ai";

        aiMessage.appendChild(
          renderAIResponse(aiText)
        );

        messagesContainer.appendChild(
          aiMessage
        );


        conversation.push({
          role: "assistant",
          content: aiText
        });


        saveCurrentConversation();

        scrollToBottom();


      } catch (error) {

        typing.remove();


        addMessage(
          "⚠️ " +
          (error.message ||
          "Impossible de contacter HACKER F5."),
          "system"
        );

      } finally {

        sendButton.disabled = false;

        sendButton.textContent = "➤";

      }

    }


    /* =========================
       HISTORIQUE
    ========================= */

    function saveCurrentConversation() {

      if (!conversation.length) {
        return;
      }


      const history =
        JSON.parse(
          localStorage.getItem("hackerF5History") ||
          "[]"
        );


      const firstUserMessage =
        conversation.find(
          message =>
            message.role === "user"
        );


      const title =
        firstUserMessage
          ? firstUserMessage.content
              .substring(0, 45)
          : "Nouvelle conversation";


      const item = {
        id: Date.now(),
        title: title,
        messages: conversation
      };


      history.unshift(item);


      const limitedHistory =
        history.slice(0, 20);


      localStorage.setItem(
        "hackerF5History",
        JSON.stringify(limitedHistory)
      );

    }

    function loadConversation(item) {

      conversation =
        Array.isArray(item.messages)
          ? [...item.messages]
          : [];


      messagesContainer.innerHTML = "";

      welcome.style.display = "none";


      conversation.forEach(message => {

        if (
          message.role === "user"
        ) {

          addMessage(
            message.content,
            "user"
          );

        } else if (
          message.role === "assistant"
        ) {

          const aiMessage =
            document.createElement("div");

          aiMessage.className =
            "message ai";

          aiMessage.appendChild(
            renderAIResponse(
              message.content
            )
          );

          messagesContainer.appendChild(
            aiMessage
          );

        }

      });


      closeSidebar();

      scrollToBottom();

    }
