<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKER F5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #15151c;
      border-bottom: 1px solid #292936;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #e50914;
      font-size: 23px;
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-title p {
      margin: 4px 0 0;
      color: #a6a6b2;
      font-size: 12px;
    }

    .status {
      color: #4ade80;
      font-size: 12px;
    }

    #chat {
      padding: 18px 14px 100px;
      max-width: 850px;
      margin: auto;
    }

    .welcome {
      text-align: center;
      padding: 35px 10px 25px;
    }

    .welcome h2 {
      font-size: 27px;
      margin: 10px 0;
    }

    .welcome p {
      color: #a6a6b2;
      line-height: 1.5;
    }

    .message {
      max-width: 90%;
      padding: 13px 15px;
      margin: 13px 0;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin-left: auto;
      background: #e50914;
      border-bottom-right-radius: 4px;
    }

    .ai {
      margin-right: auto;
      background: #1b1b25;
      border: 1px solid #30303d;
      border-bottom-left-radius: 4px;
    }

    .bottom-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: rgba(11, 11, 15, 0.96);
      border-top: 1px solid #292936;
    }

    .input-area {
      display: flex;
      gap: 8px;
      max-width: 850px;
      margin: auto;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #3a3a48;
      border-radius: 14px;
      outline: none;
      background: #171720;
      color: white;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #e50914;
    }

    #sendButton {
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      background: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    .hint {
      text-align: center;
      color: #777784;
      font-size: 11px;
      margin-top: 7px;
    }

    @media (max-width: 480px) {
      .welcome h2 {
        font-size: 23px;
      }

      .message {
        max-width: 94%;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">👑</div>

    <div class="header-title">
      <h1>HACKER F5</h1>
      <p>Assistant IA de cybersécurité responsable</p>
    </div>

    <div class="status">● En ligne</div>
  </header>

  <main id="chat">
    <section class="welcome">
      <h2>Bonjour 👑</h2>
      <p>
        Je suis HACKER F5.<br>
        Pose-moi une question pour commencer.
      </p>
    </section>

    <div class="message ai">
      Bonjour 👑 Je suis HACKER F5. Comment puis-je t’aider ?
    </div>
  </main>

  <div class="bottom-area">
    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Écris ton message..."
        autocomplete="off"
      >

      <button id="sendButton">➤</button>
    </div>

    <div class="hint">
      HACKER F5 peut faire des erreurs. Vérifie les informations importantes.
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");

    const messages = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || button.disabled) {
        return;
      }

      input.value = "";
      addMessage(text, "user");

      messages.push({
        role: "user",
        content: text
      });

      button.disabled = true;
      button.textContent = "...";

      const loading = addMessage("HACKER F5 réfléchit...", "ai");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages
          })
        });

        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "Erreur serveur Vercel : " + responseText.slice(0, 300)
          );
        }

        if (!response.ok) {
          throw new Error(
            typeof data.error === "string"
              ? data.error
              : JSON.stringify(data.error)
          );
        }

        loading.remove();

        const answer =
          data.outputs?.[0]?.content
            ?.filter(item => item.type === "text")
            ?.map(item => item.text)
            ?.join("\n")
          || data.output_text
          || data.answer
          || "HACKER F5 n’a pas renvoyé de réponse.";

        addMessage(answer, "ai");

        messages.push({
          role: "assistant",
          content: answer
        });
      } catch (error) {
        loading.textContent = "Erreur : " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "➤";
        input.focus();
      }
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
