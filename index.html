<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>HACKER F5</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;

  font-family: Arial, sans-serif;

  background: #07090d;
  color: #f5f5f5;
}

body {
  overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

header {

  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 16px;

  background: #0b0e14;

  border-bottom: 1px solid #26303d;
}

.logo {

  color: #f1f5f9;

  font-weight: 900;

  letter-spacing: 1px;

  font-size: 19px;
}

.logo::first-letter {
  color: #ff2020;
}


/* =========================
   MENU BUTTON
========================= */

.menu-button {

  width: 48px;
  height: 48px;

  border: 1px solid #3b4655;

  border-radius: 12px;

  background: #17202b;

  color: #38d9ff;

  font-size: 23px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================
   EMPEROR CORE
========================= */

.emperor-core {

  margin: 18px auto 9px;

  width: calc(100% - 24px);

  max-width: 700px;

  padding: 15px;

  background: #0a0e13;

  border: 1px solid #303d4b;

  font-family: monospace;

  overflow-x: auto;

  border-radius: 11px;
}

.emperor-core pre {

  margin: 0;

  white-space: pre;

  color: #dbeafe;

  font-size: 12px;

  line-height: 1.5;
}


/* =========================
   STATUS
========================= */

.status {

  text-align: center;

  padding: 4px;

  color: #38d9ff;

  font-size: 10px;

  letter-spacing: 0.7px;
}


/* =========================
   CHAT
========================= */

#chat {

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

  padding: 8px 14px 180px;
}

.message {

  margin: 12px 0;

  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.message.ai {
  justify-content: flex-start;
}

.bubble {

  max-width: 90%;

  padding: 13px 15px;

  border-radius: 15px;

  line-height: 1.55;

  white-space: normal;

  overflow-wrap: anywhere;

  font-size: 14px;
}

.user .bubble {

  background: #151d28;

  color: #f8fafc;

  border: 1px solid #3b4a5c;

  border-bottom-right-radius: 5px;
}

.ai .bubble {

  background: #0d141b;

  border: 1px solid #293846;

  border-bottom-left-radius: 5px;
}


/* =========================
   CODE
========================= */

.code-container {

  margin: 12px 0;

  background: #05070a;

  border: 1px solid #334155;

  border-radius: 10px;

  overflow: hidden;
}

.code-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 9px 11px;

  background: #111820;

  border-bottom: 1px solid #293542;

  font-size: 11px;

  color: #94a3b8;
}

.copy-code {

  border: 1px solid #3b82f6;

  padding: 8px 12px;

  border-radius: 8px;

  background: #10233b;

  color: #60a5fa;

  font-size: 12px;

  cursor: pointer;
}

.code-container pre {

  margin: 0;

  padding: 13px;

  overflow-x: auto;

  font-family: "Courier New", monospace;

  font-size: 12px;

  line-height: 1.5;

  color: #eeeeee;
}


/* =========================
   GENERATION TOOLS
========================= */

.tools {

  display: none;

  max-width: 760px;

  margin: 0 auto 8px;

  padding: 8px;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 7px;
}

.tools.active {
  display: grid;
}

.tool-button {

  min-height: 54px;

  padding: 7px 4px;

  border-radius: 11px;

  border: 1px solid #354252;

  background: #111820;

  color: #e2e8f0;

  font-size: 11px;

  font-weight: 700;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .2s ease;
}

.tool-button:active {
  transform: scale(.95);
}

.tool-image {
  border-color: #6d4aff;
  color: #b9a7ff;
}

.tool-video {
  border-color: #e43cff;
  color: #ef8cff;
}

.tool-pdf {
  border-color: #ff5b5b;
  color: #ff9999;
}

.tool-ppt {
  border-color: #ff9f43;
  color: #ffc078;
}

.tool-file {
  border-color: #3b82f6;
  color: #70a7ff;
}

.tool-voice {
  border-color: #22c55e;
  color: #6ee7a1;
}

.tool-music {
  border-color: #ec4899;
  color: #f472b6;
}

.tool-web {
  border-color: #06b6d4;
  color: #67e8f9;
}

.tool-code {
  border-color: #a855f7;
  color: #c084fc;
}


/* =========================
   INPUT AREA
========================= */

.input-area {

  position: fixed;

  bottom: 0;

  left: 0;

  right: 0;

  z-index: 90;

  padding: 8px;

  background:
    linear-gradient(
      to top,
      #07090d 82%,
      rgba(7, 9, 13, 0)
    );
}

.input-box {

  display: flex;

  align-items: flex-end;

  gap: 7px;

  max-width: 760px;

  margin: auto;

  padding: 7px;

  background: #10151c;

  border: 1px solid #354252;

  border-radius: 14px;
}

#messageInput {

  flex: 1;

  min-height: 46px;

  max-height: 120px;

  resize: none;

  border: 0;

  outline: 0;

  background: transparent;

  color: white;

  font-size: 15px;

  padding: 11px;
}

#messageInput::placeholder {
  color: #64748b;
}


/* =========================
   MICRO
========================= */

#micButton,
#voiceButton,
#sendButton {

  width: 48px;

  height: 48px;

  flex-shrink: 0;

  border-radius: 12px;

  color: white;

  font-size: 20px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;
}

#micButton {

  background: #12352a;

  border: 1px solid #22c55e;
}

#micButton.recording {

  background: #7f1d1d;

  border-color: #ff4d4d;

  animation: pulse 1s infinite;
}

#voiceButton {

  background: #27213d;

  border: 1px solid #a855f7;
}

#sendButton {

  background: #b91414;

  border: 1px solid #ff3838;
}

#sendButton:disabled {
  opacity: .45;
}

@keyframes pulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.07);
  }

  100% {
    transform: scale(1);
  }

}


/* =========================
   TOOLS BUTTON
========================= */

#toolsButton {

  width: 48px;

  height: 48px;

  flex-shrink: 0;

  border-radius: 12px;

  background: #102b3d;

  border: 1px solid #38d9ff;

  color: #38d9ff;

  font-size: 20px;

  cursor: pointer;
}


/* =========================
   MENU
========================= */

#menu {

  display: none;

  position: fixed;

  top: 70px;

  right: 10px;

  z-index: 200;

  width: 250px;

  padding: 9px;

  background: #10151c;

  border: 1px solid #3a4655;

  border-radius: 14px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.65);
}

#menu button {

  display: block;

  width: 100%;

  min-height: 50px;

  padding: 12px 14px;

  margin: 5px 0;

  border: 1px solid transparent;

  border-radius: 11px;

  color: #e2e8f0;

  font-size: 14px;

  font-weight: 600;

  text-align: left;

  cursor: pointer;
}

#menu button:nth-child(1) {

  background: #102b3d;

  border-color: #1e6688;

  color: #38d9ff;
}

#menu button:nth-child(2) {

  background: #351719;

  border-color: #702a2d;

  color: #ff7070;
}

#menu button:nth-child(3) {

  background: #281b3d;

  border-color: #60429a;

  color: #c084fc;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 480px) {

  .tools {

    grid-template-columns:
      repeat(3, 1fr);

  }

  .tool-button {

    font-size: 10px;

  }

  #micButton,
  #voiceButton,
  #sendButton,
  #toolsButton {

    width: 44px;
    height: 44px;

  }

}

</style>

</head>

<header>

  <button onclick="showAbout()">
    👑 À propos
  </button>

</div>


<div class="emperor-core">

<pre>╔══════════════════════╗
║     ♛ HΛ₵ҠΞЯ F5 ♛    ║
╠══════════════════════╣
║  CORE      : ONLINE  ║
║  NETWORK   : READY   ║
║  DEFENSE   : ACTIVE  ║
╚══════════════════════╝</pre>

</div>


<div
  class="status"
  id="status"
>
  F5 CORE • READY
</div>


<main id="chat"></main>


<!-- =========================
     OUTILS DE GENERATION
========================= -->

<div
  class="tools"
  id="tools"
>

  <button
    class="tool-button tool-image"
    onclick="useTool('image')"
  >
    🖼️<br>
    Image
  </button>

  <button
    class="tool-button tool-video"
    onclick="useTool('video')"
  >
    🎬<br>

  </button>

  <button
    class="tool-button tool-pdf"
    onclick="useTool('pdf')"
  >
    📄<br>
    PDF
  </button>

  <button
    class="tool-button tool-ppt"
    onclick="useTool('ppt')"
  >
    📊<br>
    PowerPoint
  </button>

  <button
    class="tool-button tool-file"
    onclick="useTool('file')"
  >
    📁<br>

  <button
    class="tool-button tool-voice"
    onclick="useTool('voice')"
  >

    class="tool-button tool-music"
    onclick="useTool('music')"

    onclick="useTool('code')"
  >

    Code
  </button>

</div>


<!-- =========================
     INPUT
========================= -->

<div class="input-area">

  <div class="input-box">

    <button
      id="toolsButton"
      type="button"
      title="Outils"
    >
      ＋
    </button>

    <button
      id="micButton"
      type="button"
      title="Micro"
    >
      🎤
    </button>

    <textarea
      id="messageInput"
      placeholder="Écris ton message..."
      rows="1"
    ></textarea>

    <button
      id="voiceButton"
      type="button"
      title="Voix IA"
    >
      🔊
    </button>

    <button
      id="sendButton"
      type="button"
    >
      ➤
    </button>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const chat =
  document.getElementById("chat");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const micButton =
  document.getElementById("micButton");

const voiceButton =
  document.getElementById("voiceButton");

const toolsButton =
  document.getElementById("toolsButton");

const tools =
  document.getElementById("tools");

const menuButton =
  document.getElementById("menuButton");

const menu =
  document.getElementById("menu");

const status =
  document.getElementById("status");

let messages = [];


/* =========================
   OUTILS
========================= */

function useTool(type) {

  const prompts = {

    image:
      "Je veux générer une image : ",

    video:
      "Je veux générer une vidéo : ",

    pdf:
      "Je veux générer un PDF : ",

    ppt:
      "Je veux générer une présentation PowerPoint : ",

    file:
      "Je veux générer un fichier ou un ZIP : ",

    voice:
      "Je veux générer une voix IA : ",

    music:
      "Je veux générer une musique : ",

    web:
      "Recherche sur le web des informations récentes sur : ",

    code:
      "Je veux générer ou analyser du code : "

  };

  messageInput.value =
    prompts[type] || "";

  tools.classList.remove("active");

  messageInput.focus();

}


/* =========================
   UTILITAIRES
========================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   FORMATAGE IA
========================= */

function renderAIText(text) {

  const escaped =
    escapeHTML(text);

  const parts =
    escaped.split(/(```[\s\S]*?```)/g);

  return parts.map(part => {

    if (
      part.startsWith("```") &&
      part.endsWith("```")
    ) {

      const lines =
        part
          .slice(3, -3)
          .split("\n");

      const language =
        lines.shift() || "code";

      const code =
        lines.join("\n");

      return `
        <div class="code-container">

          <div class="code-header">

            <span>${language}</span>

            <button
              class="copy-code"
              onclick="copyCode(this)"
            >
              Copier
            </button>

          </div>

          <pre>${code}</pre>

        </div>
      `;

    }

    return part
      .replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      )
      .replace(
        /\n/g,
        "<br>"
      );

  }).join("");

}


/* =========================
   AJOUT MESSAGE
========================= */

function addMessage(
  text,
  type
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if (type === "ai") {

    bubble.innerHTML =
      renderAIText(text);

  } else {

    bubble.textContent =
      text;

  }

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* =========================
   COPIER CODE
========================= */

function copyCode(button) {

  const code =
    button
      .closest(".code-container")
      .querySelector("pre")
      .innerText;

  navigator.clipboard
    .writeText(code)
    .then(() => {

      button.textContent =
        "Copié";

      setTimeout(() => {

        button.textContent =
          "Copier";

      }, 1500);

    });

}


/* =========================
   ENVOYER
========================= */

async function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) {
    return;
  }

  messageInput.value = "";

  messageInput.style.height =
    "auto";

  addMessage(
    text,
    "user"
  );

  messages.push({
    role: "user",
    content: text
  });

  sendButton.disabled = true;

  status.textContent =
    "F5 CORE • PROCESSING...";

  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            messages:
              messages,

            language:
              "Français"

          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Erreur serveur"
      );

    }

    const aiText =
      extractAIText(data);

    if (!aiText) {

      throw new Error(
        "Réponse IA vide"
      );

    }

    addMessage(
      aiText,
      "ai"
    );

    messages.push({
      role: "assistant",
      content: aiText
    });

    status.textContent =
      "F5 CORE • ONLINE";

    saveConversation();

  } catch (error) {

    console.error(error);

    addMessage(
      "⚠️ HACKER F5 n'a pas pu répondre. Vérifie la configuration de Vercel.",
      "ai"
    );

    status.textContent =
      "F5 CORE • ERROR";

  }

  sendButton.disabled = false;

  messageInput.focus();

}


/* =========================
   EXTRAIRE REPONSE
========================= */

function extractAIText(data) {

  if (!data) {
    return "";
  }

  if (
    typeof data.output_text ===
    "string"
  ) {

    return data.output_text;

  }

  if (
    typeof data.content ===
    "string"
  ) {

    return data.content;

  }

  if (
    Array.isArray(data.outputs)
  ) {

    for (
      const output of data.outputs
    ) {

      if (
        output &&
        typeof output.content ===
        "string"
      ) {

        return output.content;

      }

      if (
        output &&
        Array.isArray(output.content)
      ) {

        const text =
          output.content
            .map(item => {

              if (
                typeof item ===
                "string"
              ) {

                return item;

              }

              return item?.text || "";

            })
            .join("");

        if (text) {
          return text;
        }

      }

    }

  }

  return "";

}


/* =========================
   MICROPHONE
========================= */

let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "fr-FR";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.onstart =
    function() {

      micButton.classList.add(
        "recording"
      );

      status.textContent =
        "F5 CORE • LISTENING...";

    };

  recognition.onresult =
    function(event) {

      let transcript = "";

      for (
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0].transcript;

      }

      messageInput.value =
        transcript;

      messageInput.dispatchEvent(
        new Event("input")
      );

    };

  recognition.onend =
    function() {

      micButton.classList.remove(
        "recording"
      );

      status.textContent =
        "F5 CORE • ONLINE";

      messageInput.focus();

    };

  recognition.onerror =
    function(event) {

      console.error(
        "Microphone :",
        event.error
      );

      micButton.classList.remove(
        "recording"
      );

      status.textContent =
        "F5 CORE • MIC ERROR";

    };

}


/* =========================
   BOUTON MICRO
========================= */

micButton.addEventListener(
  "click",
  function() {

    if (!recognition) {

      addMessage(
        "🎤 La reconnaissance vocale n'est pas disponible dans ce navigateur.",
        "ai"
      );

      return;

    }

    try {

      recognition.start();

    } catch (error) {

      recognition.stop();

    }

  }
);


/* =========================
   VOIX IA
========================= */

voiceButton.addEventListener(
  "click",
  async function() {

    const lastAIMessage =
      [...messages]
        .reverse()
        .find(
          message =>
            message.role ===
            "assistant"
        );

    if (
      !lastAIMessage ||
      !lastAIMessage.content
    ) {

      addMessage(
        "🔊 Il n'y a pas encore de réponse à lire.",
        "ai"
      );

      return;

    }

    status.textContent =
      "F5 CORE • VOICE PROCESSING...";

    try {

      const response =
        await fetch(
          "/api/voice",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              text:
                lastAIMessage.content,

              language:
                "fr"

            })

          }
        );

      if (!response.ok) {
        throw new Error(
          "Erreur voix IA"
        );
      }

      const audioBlob =
        await response.blob();

      const audioURL =
        URL.createObjectURL(
          audioBlob
        );

      const audio =
        new Audio(audioURL);

      await audio.play();

      audio.onended =
        function() {

          URL.revokeObjectURL(
            audioURL
          );

        };

      status.textContent =
        "F5 CORE • ONLINE";

    } catch (error) {

      console.error(error);

      status.textContent =
        "F5 CORE • VOICE ERROR";

      addMessage(
        "🔊 La voix IA n'est pas encore connectée. Elle sera activée dans api/chat.js.",
        "ai"
      );

    }

  }
);


/* =========================
   OUTILS
========================= */

toolsButton.addEventListener(
  "click",
  function() {

    tools.classList.toggle(
      "active"
    );

  }
);


/* =========================
   MENU
========================= */

menuButton.addEventListener(
  "click",
  function() {

    if (
      menu.style.display ===
      "block"
    ) {

      closeMenu();

    } else {

      menu.style.display =
        "block";

    }

  }
);

function closeMenu() {

  menu.style.display =
    "none";

}


/* =========================
   NOUVELLE CONVERSATION
========================= */

function newConversation() {

  messages = [];

  chat.innerHTML = "";

  localStorage.removeItem(
    "hacker_f5_messages"
  );

  status.textContent =
    "F5 CORE • READY";

  closeMenu();

  messageInput.focus();

}


/* =========================
   EFFACER
========================= */

function clearChat() {

  newConversation();

}


/* =========================
   A PROPOS
========================= */

function showAbout() {

  closeMenu();

  addMessage(
`╔══════════════════════╗
║     ♛ HΛ₵ҠΞЯ F5 ♛    ║
╠══════════════════════╣

/* =========================
   CLAVIER
========================= */

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   AUTO RESIZE
========================= */

messageInput.addEventListener(
  "input",
  function() {

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        120
      ) + "px";

  }
);


/* =========================
   ENVOYER
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =========================
   SAUVEGARDE
========================= */

function saveConversation() {

  try {

    localStorage.setItem(
      "hacker_f5_messages",
      JSON.stringify(messages)
    );

  } catch (error) {

    console.log(
      "Sauvegarde locale indisponible"
    );

  }

}

function loadConversation() {

  try {

    const saved =
      localStorage.getItem(
        "hacker_f5_messages"
      );

    if (!saved) {
      return;
    }

    messages =
      JSON.parse(saved);

    messages.forEach(
      message => {

        if (
          message.role ===
          "user"
        ) {

          addMessage(
            message.content,
            "user"
          );

        }

        if (
          message.role ===
          "assistant"
        ) {

          addMessage(
            message.content,
            "ai"
          );

        }

      }
    );

  } catch (error) {

    messages = [];

  }

}


/* =========================
   INITIALISATION
========================= */

window.addEventListener(
  "load",
  function() {

    loadConversation();

    messageInput.focus();

  }
);

</script>
