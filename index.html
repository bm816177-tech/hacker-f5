<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>HACKER F5 👑</title>

  <style>
    :root {
      --bg: #050505;
      --panel: #0b0b0b;
      --panel2: #111111;
      --red: #ff2020;
      --red2: #ff4b4b;
      --green: #00ff88;
      --text: #f5f5f5;
      --muted: #9b9b9b;
      --border: rgba(255, 32, 32, .25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(255,0,0,.08), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5,5,5,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 12px;
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #111;
      border: 1px solid rgba(255,0,0,.45);
      box-shadow: 0 0 18px rgba(255,0,0,.25);
    }

    .brand {
      flex: 1;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.2s infinite;
    }

    /* BANNER */

    .banner {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      background: linear-gradient(
        90deg,
        rgba(255,0,0,.08),
        rgba(255,0,0,.02)
      );
      text-align: center;
      font-family: monospace;
      font-size: 11px;
      overflow: hidden;
    }

    .banner-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 18px;
    }

    .banner-dots {
      display: flex;
      gap: 4px;
    }

    .banner-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #333;
      transition: .2s;
    }

    .banner-dot.active {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .banner-dot.green {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* MAIN */

    main {
      flex: 1;
      padding: 12px;
      padding-bottom: 125px;
    }

    .welcome {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 0 25px rgba(255,0,0,.06);
    }

    .welcome-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .welcome-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* MODES */

    .modes {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .modes::-webkit-scrollbar {
      display: none;
    }

    .mode {
      flex: 0 0 auto;
      border: 1px solid #222;
      background: #0c0c0c;
      color: #aaa;
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 11px;
    }

    .mode.active {
      color: white;
      border-color: rgba(255,0,0,.6);
      background: rgba(255,0,0,.1);
    }

    /* CHAT */

    #chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 94%;
      border-radius: 14px;
      padding: 11px 13px;
      line-height: 1.55;
      font-size: 14px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #1c1c1c;
      border: 1px solid #303030;
    }

    .message.assistant {
      align-self: flex-start;
      background: #0d0d0d;
      border: 1px solid var(--border);
    }

    .message.system {
      align-self: center;
      max-width: 100%;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* MARKDOWN */

    .formatted {
      white-space: normal;
    }

    .formatted strong {
      color: #fff;
    }

    .formatted h1,
    .formatted h2,
    .formatted h3 {
      margin: 8px 0;
    }

    .formatted ul,
    .formatted ol {
      padding-left: 22px;
    }

    .formatted code.inline {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 5px;
      padding: 2px 5px;
      font-family: monospace;
    }

    /* CODE BLOCK */

    .code-wrapper {
      margin: 10px 0;
      border: 1px solid rgba(255,0,0,.3);
      border-radius: 10px;
      overflow: hidden;
      background: #050505;
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 9px;
      background: #101010;
      border-bottom: 1px solid #242424;
      font-size: 10px;
      color: #aaa;
    }

    .copy-code {
      border: 1px solid #333;
      background: #171717;
      color: white;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 10px;
    }

    .copy-code:active {
      transform: scale(.96);
    }

    .code-content {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      color: #f1f1f1;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
    }

    /* EXECUTION */

    .execution-box {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255,0,0,.35);
      border-radius: 14px;
      background: #080808;
      box-shadow: 0 0 20px rgba(255,0,0,.1);
      font-family: monospace;
    }

    .execution-title {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .execution-action {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 13px;
    }

    .execution-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .progress-bar {
      font-size: 12px;
      letter-spacing: 0;
      font-weight: 900;
      white-space: nowrap;
    }

    .progress-percent {
      min-width: 38px;
      font-weight: 900;
      font-size: 12px;
    }

    .execution-status {
      margin-top: 12px;
      color: #aaa;
      font-size: 11px;
      animation: statusPulse 1.2s infinite;
    }

    .execution-complete {
      border-color: rgba(0,255,136,.4);
    }

    .execution-complete .execution-status {
      color: var(--green);
      animation: none;
    }

    .execution-error {
      border-color: rgba(255,50,50,.6);
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 9px;
      background: rgba(5,5,5,.96);
      backdrop-filter: blur(15px);
      border-top: 1px solid var(--border);
    }

    .composer {
      width: 100%;
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .circle-btn {
      flex: 0 0 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #2d2d2d;
      background: #101010;
      color: white;
      font-size: 18px;
    }

    .circle-btn.red {
      border-color: rgba(255,0,0,.5);
      background: rgba(255,0,0,.1);
    }

    #input {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: none;
      border: 1px solid #282828;
      outline: none;
      border-radius: 13px;
      padding: 11px 12px;
      color: white;
      background: #0e0e0e;
      line-height: 1.4;
    }

    #input:focus {
      border-color: rgba(255,0,0,.55);
    }

    /* MENUS */

    .menu {
      position: fixed;
      bottom: 68px;
      z-index: 40;
      width: min(340px, calc(100vw - 20px));
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid rgba(255,0,0,.35);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.65);
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .menu.show {
      display: grid;
    }

    #plusMenu {
      left: 10px;
    }

    #equalMenu {
      left: 58px;
    }

    .menu-title {
      grid-column: 1 / -1;
      color: #888;
      font-size: 10px;
      padding: 4px;
    }

    .menu button {
      border: 1px solid #272727;
      background: #111;
      color: white;
      border-radius: 9px;
      padding: 10px 7px;
      font-size: 11px;
    }

    .menu button:active {
      transform: scale(.97);
    }

    /* FILE */

    #fileInput {
      display: none;
    }

    /* ANIMATIONS */

    @keyframes pulse {
      0%,100% {
        opacity: .5;
        transform: scale(.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes statusPulse {
      0%,100% {
        opacity: .4;
      }

      50% {
        opacity: 1;
      }
    }

    @media (min-width: 700px) {
      main {
        padding: 20px;
      }

      .message {
        max-width: 82%;
      }

      .composer-area {
        padding: 12px 20px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="header-main">

      <img
        id="logo"
        src=""
        alt="HACKER F5"
      >

      <div class="brand">
        <div class="brand-title">
          👑 HACKER F5
        </div>

        <div class="brand-subtitle">
          ASSISTANT IA DE CYBERSÉCURITÉ RESPONSABLE
        </div>

        <div class="status">
          <span class="status-dot"></span>
          SYSTÈME ACTIF
        </div>
      </div>

    </div>

    <div class="banner">
      <div class="banner-line">
        <div class="banner-dots">
          <span id="dot1" class="banner-dot active"></span>
          <span id="dot2" class="banner-dot"></span>
          <span id="dot3" class="banner-dot"></span>
        </div>

        <span id="activity">
          HACKF5 ACTIVATE
        </span>

        <div class="banner-dots">
          <span id="dot4" class="banner-dot"></span>
          <span id="dot5" class="banner-dot active"></span>
          <span id="dot6" class="banner-dot"></span>
        </div>
      </div>
    </div>
  </header>

  <main>

    <div class="welcome" id="welcome">
      <div class="welcome-title">
        👑 Bienvenue sur HACKER F5
      </div>

      <div class="welcome-text">
        Ton assistant IA pour la programmation,
        l'analyse numérique, les documents,
        la recherche et la cybersécurité responsable.
      </div>
    </div>

    <div class="modes">

      <button class="mode active" data-mode="chat">
        💬 Chat
      </button>

      <button class="mode" data-mode="code">
        💻 Code
      </button>

      <button class="mode" data-mode="cyber">
        🛡️ Cyber
      </button>

      <button class="mode" data-mode="decode">
        🔐 Décodage
      </button>

      <button class="mode" data-mode="files">
        📎 Fichiers
      </button>

    </div>

    <div id="chat"></div>

  </main>

  <!-- MENU + -->

  <div
    id="plusMenu"
    class="menu"
  >

    <div class="menu-title">
      ⚡ CRÉATION & FICHIERS
    </div>

    <button onclick="selectCreation('image')">
      🖼️ Image
    </button>

    <button onclick="selectCreation('video')">
      🎬 Vidéo
    </button>

    <button onclick="selectCreation('music')">
      🎵 Musique
    </button>

    <button onclick="selectCreation('pdf')">
      📄 PDF
    </button>

    <button onclick="selectCreation('docx')">
      📝 DOCX
    </button>

    <button onclick="selectCreation('xlsx')">
      📊 XLSX
    </button>

    <button onclick="selectCreation('pptx')">
      📽️ PPTX
    </button>

    <button onclick="selectCreation('txt')">
      📋 TXT
    </button>

    <button onclick="selectCreation('md')">
      🗒️ Markdown
    </button>

    <button onclick="selectCreation('csv')">
      📑 CSV
    </button>

    <button onclick="document.getElementById('fileInput').click()">
      📎 Fichier
    </button>

    <button onclick="newChat()">
      🆕 Nouveau
    </button>

  </div>

  <!-- MENU = -->

  <div
    id="equalMenu"
    class="menu"
  >

    <div class="menu-title">
      ⚙️ OUTILS HACKER F5
    </div>

    <button onclick="setMode('code')">
      💻 Code
    </button>

    <button onclick="setMode('cyber')">
      🛡️ Cyber
    </button>

    <button onclick="setMode('decode')">
      🔐 Décodage
    </button>

    <button onclick="setMode('web')">
      🌐 Recherche Web
    </button>

      🔊 Lire
    </button>

    <button onclick="stopVoice()">
      🛑 Stop vocal
    </button>

  </div>

  <input
    id="fileInput"
    type="file"
    multiple
  >

  <div class="composer-area">

    <div class="composer">

      <button
        class="circle-btn"
        onclick="togglePlus()"
      >
        +
      </button>

      <button
        class="circle-btn"
        onclick="toggleEqual()"
      >
        =
      </button>

      <button
        class="circle-btn"
        onclick="startVoice()"
      >
        🎙️
      </button>

      <textarea
        id="input"
        rows="1"
        placeholder="Écris à HACKER F5..."
      ></textarea>

      <button
        class="circle-btn red"
        onclick="send()"
      >
        ➤
      </button>

    </div>

  </div>

</div>

<script>
  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("input");

  const fileInput =
    document.getElementById("fileInput");

  const activity =
    document.getElementById("activity");

  const welcome =
    document.getElementById("welcome");

  let messages = [];

  let currentMode = "chat";

  let currentConversationId = null;

  let bannerTextTimer = null;

  let bannerDotTimer = null;

  let lastAssistantText = "";

  /* -------------------------
     ESCAPE
  ------------------------- */

  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* -------------------------
     MARKDOWN SIMPLE
  ------------------------- */

  function renderMarkdown(text) {

    let source = esc(text);

    const blocks = [];

    source = source.replace(
      /```([\w-]*)\n?([\s\S]*?)```/g,
      function(_, language, code) {

        const id =
          "code_" +
          Date.now() +
          "_" +
          blocks.length;

        blocks.push({
          id,
          language:
            language || "code",
          code
        });

        return `@@CODE_${blocks.length - 1}@@`;
      }
    );

    source = source
      .replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
      )
      .replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
      )
      .replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
      )
      .replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      )
      .replace(
        /`([^`\n]+)`/g,
        '<code class="inline">$1</code>'
      )
      .replace(
        /^[-•] (.*)$/gm,
        "• $1"
      )
      .replace(
        /\n/g,
        "<br>"
      );

    blocks.forEach(
      (block, index) => {

        const html = `
          <div class="code-wrapper">

            <div class="code-head">

              <span>
                💻 ${esc(block.language)}
              </span>

              <button
                class="copy-code"
                onclick="copyCode('${block.id}')"
                data-code-id="${block.id}"
              >
                📋 Copier
              </button>

            </div>

            <pre
              id="${block.id}"
              class="code-content"
            >${block.code}</pre>

          </div>
        `;

        source = source.replace(
          `@@CODE_${index}@@`,
          html
        );
      }
    );

    return source;
  }

  /* -------------------------
     MESSAGE
  ------------------------- */

  function addMessage(
    role,
    text
  ) {

    const box =
      document.createElement("div");

    box.className =
      "message " + role;

    if (role === "assistant") {

      box.innerHTML =
        `<div class="formatted">
          ${renderMarkdown(text)}
        </div>`;

      lastAssistantText = text;

    } else {

      box.textContent = text;
    }

    chat.appendChild(box);

    chat.scrollTop =
      chat.scrollHeight;

    return box;
  }

  /* -------------------------
     COPY CODE
  ------------------------- */

  async function copyCode(id) {

    const element =
      document.getElementById(id);

    if (!element) return;

    try {

      await navigator.clipboard.writeText(
        element.textContent
      );

      const button =
        document.querySelector(
          `[data-code-id="${id}"]`
        );

      if (button) {

        const old =
          button.textContent;

        button.textContent =
          "✅ Copié";

        setTimeout(() => {
          button.textContent = old;
        }, 1400);
      }

    } catch {

      addMessage(
        "system",
        "Impossible de copier automatiquement ce code."
      );
    }
  }

  /* -------------------------
     BANNER
  ------------------------- */

  function setWorking(text) {

    clearInterval(bannerTextTimer);
    clearInterval(bannerDotTimer);

    activity.textContent = "";

    let index = 0;

    bannerTextTimer =
      setInterval(() => {

        if (index < text.length) {

          activity.textContent +=
            text[index];

          index++;

        } else {

          clearInterval(
            bannerTextTimer
          );
        }

      }, 25);

    const dots = [
      document.getElementById("dot1"),
      document.getElementById("dot2"),
      document.getElementById("dot3"),
      document.getElementById("dot4"),
      document.getElementById("dot5"),
      document.getElementById("dot6")
    ];

    let step = 0;

    bannerDotTimer =
      setInterval(() => {

        dots.forEach(dot => {
          dot.className =
            "banner-dot";
        });

        dots[step % dots.length]
          .classList.add("active");

        dots[
          (step + 1) % dots.length
        ].classList.add("green");

        step++;

      }, 280);
  }

  function setReady() {

    clearInterval(bannerTextTimer);
    clearInterval(bannerDotTimer);

    activity.textContent =
      "HACKF5 ACTIVATE";

    const dots = document.querySelectorAll(
      ".banner-dot"
    );

    dots.forEach(dot => {
      dot.className =
        "banner-dot";
    });

    document
      .getElementById("dot1")
      .classList.add("active");

    document
      .getElementById("dot5")
      .classList.add("active");
  }

  /* -------------------------
     EXECUTION
  ------------------------- */

  function progressMessage(
    action,
    status
  ) {

    const box =
      document.createElement("div");

    box.className =
      "message assistant";

    box.innerHTML = `
      <div class="execution-box">

        <div class="execution-title">
          👑 HACKER F5
        </div>

                <div class="execution-action">
          ACTION : ${esc(action)}
        </div>

        <div class="execution-progress">

          <span class="progress-bar">
            ░░░░░░░░░░░░░░░░
          </span>

          <span class="progress-percent">
            0%
          </span>

        </div>

        <div class="execution-status">
          ${esc(status)}
        </div>

      </div>
    `;

    chat.appendChild(box);

    chat.scrollTop =
      chat.scrollHeight;

    const bar =
      box.querySelector(
        ".progress-bar"
      );

    const percent =
      box.querySelector(
        ".progress-percent"
      );

    const statusBox =
      box.querySelector(
        ".execution-status"
      );

    let progress = 0;

    const timer =
      setInterval(() => {

        if (progress < 90) {

          progress +=
            Math.floor(
              Math.random() * 6
            ) + 1;

          if (progress > 90) {
            progress = 90;
          }

          const total = 16;

          const filled =
            Math.floor(
              progress / 100 * total
            );

          bar.textContent =
            "█".repeat(filled) +
            "░".repeat(
              total - filled
            );

          percent.textContent =
            progress + "%";

          chat.scrollTop =
            chat.scrollHeight;
        }

      }, 450);

    return {

      complete(message) {

        clearInterval(timer);

        bar.textContent =
          "████████████████";

        percent.textContent =
          "100%";

        statusBox.textContent =
          message ||
          "Traitement terminé.";

        box
          .querySelector(".execution-box")
          .classList.add(
            "execution-complete"
          );

        chat.scrollTop =
          chat.scrollHeight;
      },

      error(message) {

        clearInterval(timer);

        statusBox.textContent =
          message ||
          "Une erreur est survenue.";

        box
          .querySelector(".execution-box")
          .classList.add(
            "execution-error"
          );

        chat.scrollTop =
          chat.scrollHeight;
      }
    };
  }

  /* -------------------------
     MENUS
  ------------------------- */

  function closeMenus() {

    document
      .getElementById("plusMenu")
      .classList.remove("show");

    document
      .getElementById("equalMenu")
      .classList.remove("show");
  }

  function togglePlus() {

    const menu =
      document.getElementById(
        "plusMenu"
      );

    document
      .getElementById("equalMenu")
      .classList.remove("show");

    menu.classList.toggle("show");
  }

  function toggleEqual() {

    const menu =
      document.getElementById(
        "equalMenu"
      );

    document
      .getElementById("plusMenu")
      .classList.remove("show");

    menu.classList.toggle("show");
  }

  /* -------------------------
     MODE
  ------------------------- */

  function setMode(mode) {

    currentMode = mode;

    document
      .querySelectorAll(".mode")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.mode === mode
        );
      });

    const names = {
      chat: "Chat IA",
      code: "Analyse du code",
      cyber: "Cybersécurité",
      decode: "Décodage",
      files: "Analyse de fichiers",
      web: "Recherche Web"
    };

    input.placeholder =
      names[mode] ||
      "Écris à HACKER F5...";

    closeMenus();
  }

  document
    .querySelectorAll(".mode")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => setMode(
          button.dataset.mode
        )
      );
    });

  /* -------------------------
     CREATION
  ------------------------- */

  function selectCreation(type) {

    closeMenus();

    currentMode = type;

    const names = {
      image:
        "Décris l'image à générer...",
      video:
        "Décris la vidéo à générer...",
      music:
        "Décris la musique ou chanson à générer...",
      pdf:
        "Décris le document PDF...",
      docx:
        "Décris le document DOCX...",
      xlsx:
        "Décris le tableau XLSX...",
      pptx:
        "Décris la présentation PPTX...",
      txt:
        "Écris le contenu du fichier TXT...",
      md:
        "Écris le contenu Markdown...",
      csv:
        "Décris les données CSV..."
    };

    input.placeholder =
      names[type] ||
      "Écris à HACKER F5...";

    input.focus();
  }

  /* -------------------------
     NOUVEAU CHAT
  ------------------------- */

  function newChat() {

    messages = [];

    currentConversationId =
      null;

    lastAssistantText = "";

    chat.innerHTML = "";

    welcome.style.display =
      "block";

    setMode("chat");

    addMessage(
      "system",
      "🆕 Nouvelle conversation activée."
    );

    closeMenus();
  }

  /* -------------------------
     API CHAT
  ------------------------- */

  async function askMistral(
    execution
  ) {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            messages,

            conversationId:
              currentConversationId,

            mode:
              currentMode

          })
        }
      );

    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Réponse serveur invalide."
      );
    }

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data?.error ||
        "Erreur du serveur."
      );
    }

    if (
      data.conversationId
    ) {

      currentConversationId =
        data.conversationId;
    }

    const answer =
      data.answer ||
      "Aucune réponse reçue.";

    messages.push({
      role: "assistant",
      content: answer
    });

    execution.complete(
      "Réponse reçue avec succès."
    );

    addMessage(
      "assistant",
      answer
    );

    setReady();

    return answer;
  }

  /* -------------------------
     ACTION
  ------------------------- */

  function getActionInfo() {

    const info = {

      chat: {
        action:
          "TRAITEMENT DE LA DEMANDE",
        status:
          "Analyse de la demande..."
      },

      web: {
        action:
          "RECHERCHE WEB",
        status:
          "Recherche des informations..."
      },

      image: {
        action:
          "GÉNÉRATION IMAGE",
        status:
          "Traitement de l'image..."
      },

      video: {
        action:
          "GÉNÉRATION VIDÉO",
        status:
          "Génération de la vidéo..."
      },

      music: {
        action:
          "GÉNÉRATION MUSIQUE",
        status:
          "Création de la musique..."
      },

      code: {
        action:
          "ANALYSE DU CODE",
        status:
          "Analyse du code en cours..."
      },

      cyber: {
        action:
          "ANALYSE CYBERSÉCURITÉ",
        status:
          "Analyse de sécurité..."
      },

      decode: {
        action:
          "DÉCODAGE",
        status:
          "Analyse des données..."
      },

      files: {
        action:
          "ANALYSE DE FICHIER",
        status:
          "Lecture du fichier..."
      },

      pdf: {
        action:
          "GÉNÉRATION PDF",
        status:
          "Préparation du document..."
      },

      docx: {
        action:
          "GÉNÉRATION DOCX",
        status:
          "Préparation du document..."
      },

      xlsx: {
        action:
          "GÉNÉRATION XLSX",
        status:
          "Préparation du tableau..."
      },

      pptx: {
        action:
          "GÉNÉRATION PPTX",
        status:
          "Préparation de la présentation..."
      },

      txt: {
        action:
          "GÉNÉRATION TXT",
        status:
          "Préparation du fichier..."
      },

      md: {
        action:
          "GÉNÉRATION MARKDOWN",
        status:
          "Préparation du fichier..."
      },

      csv: {
        action:
          "GÉNÉRATION CSV",
        status:
          "Préparation des données..."
      }
    };

    return (
      info[currentMode] ||
      info.chat
    );
  }

  /* -------------------------
     SEND
  ------------------------- */

  async function send() {

    const text =
      input.value.trim();

    if (!text) return;

    closeMenus();

    welcome.style.display =
      "none";

    input.value = "";

    addMessage(
      "user",
      text
    );

    messages.push({
      role: "user",
      content: text
    });

    const info =
      getActionInfo();

    setWorking(
      info.action
    );

    const execution =
      progressMessage(
        info.action,
        info.status
      );

    try {

      /*
       * Les fonctions de génération
       * seront branchées aux API
       * correspondantes.
       */

      if (
        [
          "image",
          "video",
          "music",
          "pdf",
          "docx",
          "xlsx",
          "pptx",
          "txt",
          "md",
          "csv"
        ].includes(currentMode)
      ) {

        /*
         * Pour éviter de prétendre
         * qu'une génération existe
         * avant que son API soit branchée.
         */

        execution.complete(
          "Demande préparée."
        );

        addMessage(
          "system",
          "⚙️ Cette fonction est prête dans l'interface. Son service de génération doit être connecté."
        );

        setReady();

        return;
      }

      await askMistral(
        execution
      );

    } catch (error) {

      execution.error(
        error?.message ||
        "Erreur pendant le traitement."
      );

      addMessage(
        "system",
        "⚠️ " +
        (
          error?.message ||
          "Une erreur est survenue."
        )
      );

      setReady();
    }
  }

  /* -------------------------
     ENTER
  ------------------------- */

  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        send();
      }
    }
  );

  /* -------------------------
     FICHIERS
  ------------------------- */

  fileInput.addEventListener(
    "change",
    async event => {

      const files =
        Array.from(
          event.target.files || []
        );

      if (!files.length) {
        return;
      }

      for (const file of files) {

        addMessage(
          "system",
          `📎 Fichier sélectionné : ${file.name}`
        );

        /*
         * Formats texte directement
         * lisibles dans le navigateur.
         */

        const isText =
          file.type.startsWith("text/") ||
          /\.(txt|md|csv|json|js|css|html|xml)$/i.test(
            file.name
          );

        if (isText) {

          try {

            const content =
              await file.text();

            const limited =
              content.slice(
                0,
                30000
              );

            messages.push({
              role: "user",
              content:
                `Analyse le fichier "${file.name}".\n\n${limited}`
            });

            currentMode =
              "files";

            const info =
              getActionInfo();

            setWorking(
              info.action
            );

            const execution =
              progressMessage(
                info.action,
                info.status
              );

            await askMistral(
              execution
            );

          } catch (error) {

            addMessage(
              "system",
              "⚠️ Impossible de lire ce fichier."
            );
          }

        } else {

          addMessage(
            "system",
            "📎 Le fichier est sélectionné. L'analyse des PDF/DOCX/XLSX/PPTX sera reliée à la route serveur de fichiers."
          );
        }
      }

      fileInput.value = "";
    }
  );

  /* -------------------------
     VOIX
  ------------------------- */

  let recognition =
    null;

  function startVoice() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      addMessage(
        "system",
        "🎙️ La reconnaissance vocale n'est pas disponible sur ce navigateur."
      );

      return;
    }

    recognition =
      new SpeechRecognition();

    recognition.lang =
      "fr-FR";

    recognition.interimResults =
      false;

    recognition.continuous =
      false;

    setWorking(
      "ÉCOUTE VOCALE"
    );

    recognition.onresult =
      event => {

        const result =
          event.results[0][0]
            .transcript;

        input.value =
          result;

        setReady();

        send();
      };

    recognition.onerror =
      () => {

        setReady();

        addMessage(
          "system",
          "⚠️ La reconnaissance vocale a échoué."
        );
      };

    recognition.onend =
      () => {

        setReady();
      };

    recognition.start();
  }

  function speakLast() {

    if (!lastAssistantText) {

      addMessage(
        "system",
        "🔊 Aucune réponse à lire."
      );

      return;
    }

    stopVoice();

    const utterance =
      new SpeechSynthesisUtterance(
        lastAssistantText
      );

    utterance.lang =
      "fr-FR";

    setWorking(
      "LECTURE VOCALE"
    );

    speechSynthesis.speak(
      utterance
    );

    utterance.onend =
      setReady;
  }

  function stopVoice() {

    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.cancel();
    }

    setReady();
  }

  /* -------------------------
     INITIALISATION
  ------------------------- */

  setReady();

  addMessage(
    "assistant",
    "Lab HACKF5 ACTIVATE 🇦🇱\n\n👑 HACKF5 ✍️\n(by - king 👑 Franck)\n\n⚡ Je suis prêt."
  );
</script>
