<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HACKER F5</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #07090d;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 13px 15px;

  background: #0b0e14;
  border-bottom: 1px solid #26303d;
}

.logo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1px;
}

.menu-button {
  width: 46px;
  height: 46px;

  border-radius: 12px;
  border: 1px solid #3b4655;

  background: #17202b;
  color: #38d9ff;

  font-size: 22px;
}

/* CORE */

.emperor-core {
  width: calc(100% - 24px);
  max-width: 700px;

  margin: 16px auto 7px;
  padding: 14px;

  background: #0a0e13;

  border: 1px solid #303d4b;
  border-radius: 11px;

  overflow-x: auto;
}

.emperor-core pre {
  margin: 0;

  font-family: monospace;
  font-size: 12px;
  line-height: 1.5;

  color: #dbeafe;
}

/* STATUS */

.status {
  text-align: center;

  padding: 5px;

  color: #38d9ff;

  font-size: 10px;
  letter-spacing: .7px;
}

/* CHAT */

#chat {
  width: 100%;
  max-width: 760px;

  margin: auto;

  padding: 8px 14px 180px;
}

.message {
  display: flex;
  margin: 12px 0;
}

.message.user {
  justify-content: flex-end;
}

.message.ai {
  justify-content: flex-start;
}

.bubble {
  max-width: 90%;

  padding: 13px 15px;

  border-radius: 15px;

  line-height: 1.55;

  overflow-wrap: anywhere;

  font-size: 14px;
}

.user .bubble {
  background: #151d28;

  border: 1px solid #3b4a5c;

  border-bottom-right-radius: 5px;
}

.ai .bubble {
  background: #0d141b;

  border: 1px solid #293846;

  border-bottom-left-radius: 5px;
}

/* CODE */

.code-container {
  margin: 12px 0;

  background: #05070a;

  border: 1px solid #334155;

  border-radius: 10px;

  overflow: hidden;
}

.code-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  padding: 9px 11px;

  background: #111820;

  border-bottom: 1px solid #293542;

  font-size: 11px;

  color: #94a3b8;
}

.copy-code {
  padding: 7px 11px;

  border-radius: 8px;

  border: 1px solid #3b82f6;

  background: #10233b;

  color: #60a5fa;
}

.code-container pre {
  margin: 0;

  padding: 13px;

  overflow-x: auto;

  font-family: "Courier New", monospace;

  font-size: 12px;
  line-height: 1.5;

  color: #eeeeee;
}

/* OUTILS */

.tools {
  display: none;

  width: 100%;
  max-width: 760px;

  margin: 0 auto 8px;

  padding: 8px;

  grid-template-columns: repeat(3, 1fr);

  gap: 7px;
}

.tools.active {
  display: grid;
}

.tool-button {
  min-height: 56px;

  padding: 7px 4px;

  border-radius: 11px;

  border: 1px solid #354252;

  background: #111820;

  color: #e2e8f0;

  font-size: 10px;
  font-weight: 700;
}

.tool-image { border-color: #6d4aff; }
.tool-video { border-color: #e43cff; }
.tool-pdf { border-color: #ff5b5b; }
.tool-ppt { border-color: #ff9f43; }
.tool-file { border-color: #3b82f6; }
.tool-voice { border-color: #22c55e; }
.tool-music { border-color: #ec4899; }
.tool-web { border-color: #06b6d4; }
.tool-code { border-color: #a855f7; }

/* INPUT */

.input-area {
  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  z-index: 90;

  padding: 8px;

  background:
    linear-gradient(
      to top,
      #07090d 82%,
      rgba(7,9,13,0)
    );
}

.input-box {
  display: flex;

  align-items: flex-end;

  gap: 7px;

  max-width: 760px;

  margin: auto;

  padding: 7px;

  background: #10151c;

  border: 1px solid #354252;

  border-radius: 14px;
}

#messageInput {
  flex: 1;

  min-height: 46px;
  max-height: 120px;

  resize: none;

  border: 0;
  outline: 0;

  background: transparent;

  color: white;

  font-size: 15px;

  padding: 11px;
}

#messageInput::placeholder {
  color: #64748b;
}

.input-button {
  width: 46px;
  height: 46px;

  flex-shrink: 0;

  border-radius: 11px;

  font-size: 19px;
}

#toolsButton {
  background: #102b3d;

  border: 1px solid #38d9ff;

  color: #38d9ff;
}

#micButton {
  background: #12352a;

  border: 1px solid #22c55e;
}

#voiceButton {
  background: #27213d;

  border: 1px solid #a855f7;

  color: white;
}

#sendButton {
  background: #b91414;

  border: 1px solid #ff3838;

  color: white;
}

#sendButton:disabled {
  opacity: .45;
}

/* MENU */

#menu {
  display: none;

  position: fixed;

  top: 70px;
  right: 10px;

  z-index: 200;

  width: 260px;

  padding: 9px;

  background: #10151c;

  border: 1px solid #3a4655;

  border-radius: 14px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.65);
}

.menu-item {
  display: block;

  width: 100%;

  min-height: 48px;

  margin: 5px 0;

  padding: 11px 13px;

  border-radius: 10px;

  border: 1px solid #273442;

  background: #151d26;

  color: #e2e8f0;

  text-align: left;

  font-size: 13px;
}

/* PANELS */

.panel {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 300;

  padding: 70px 14px 20px;

  background: rgba(0,0,0,.86);

  overflow-y: auto;
}

.panel-box {
  max-width: 650px;

  margin: auto;

  padding: 18px;

  background: #0d141b;

  border: 1px solid #334155;

  border-radius: 15px;
}

.panel-title {
  margin-bottom: 15px;

  color: #38d9ff;

  font-size: 18px;

  font-weight: 800;
}

.panel-button {
  width: 100%;

  min-height: 48px;

  margin: 6px 0;

  border-radius: 10px;

  border: 1px solid #334155;

  background: #111820;

  color: white;

  text-align: left;

  padding: 11px;
}

.close-panel {
  background: #351719;

  border-color: #702a2d;

  color: #ff7070;
}

/* HISTORIQUE */

.history-item {
  width: 100%;

  padding: 11px;

  margin: 6px 0;

  border-radius: 10px;

  border: 1px solid #293846;

  background: #111820;

  color: #e2e8f0;

  text-align: left;
}

/* RESPONSIVE */

@media (max-width: 480px) {

  .tool-button {
    font-size: 9px;
  }

  .input-button {
    width: 43px;
    height: 43px;
  }
}

</style>
</head>

<body>

<header>

  <div class="logo">
    ♛ HΛ₵ҠΞЯ F5
  </div>

  <button
    class="menu-button"
    id="menuButton"
    type="button"
  >
    ☰
  </button>

</header>

<div id="menu">

  <button class="menu-item" onclick="newConversation()">
    🆕 Nouvelle conversation
  </button>

  <button class="menu-item" onclick="openHistory()">
    🕘 Historique
  </button>

  <button class="menu-item" onclick="openLanguage()">
    🌐 Langue
  </button>

  <button class="menu-item" onclick="openSettings()">

  </button>

  <button class="menu-item" onclick="clearChat()">
    🗑️ Effacer la conversation
  </button>

  <button class="menu-item" onclick="showAbout()">
    👑 À propos
  </button>

</div>

<div class="emperor-core">

<pre>╔══════════════════════╗
║     ♛ HΛ₵ҠΞЯ F5 ♛    ║
╠══════════════════════╣
║  CORE      : ONLINE  ║
║  NETWORK   : READY   ║
║  DEFENSE   : ACTIVE  ║
╚══════════════════════╝</pre>

</div>

<div class="status" id="status">
  F5 CORE • READY
</div>

<main id="chat"></main>

<div class="tools" id="tools">

  <button class="tool-button tool-image" onclick="useTool('image')">
    🖼️<br>Image
  </button>

  <button class="tool-button tool-video" onclick="useTool('video')">
    🎬<br>Vidéo
  </button>

  <button class="tool-button tool-pdf" onclick="useTool('pdf')">
    📄<br>PDF
  </button>

  </button>

  </button>

  <button class="tool-button tool-voice" onclick="useTool('voice')">
    🎙️<br>Voix IA

<div class="input-area">

  <div class="input-box">

      class="input-button"

      id="micButton"
      type="button"
    >

    </button>

      id="messageInput"
      placeholder="Écris ton message..."
      rows="1"
    ></textarea>

    <button
      class="input-button"
      id="voiceButton"
      type="button"
    >
      🔊
    </button>

      class="input-button"

      🗑️ Effacer la conversation

</div>

<script>

/* VARIABLES */

const chat =
  document.getElementById("chat");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const micButton =
  document.getElementById("micButton");

const voiceButton =
  document.getElementById("voiceButton");

const toolsButton =
  document.getElementById("toolsButton");

const tools =
  document.getElementById("tools");

const menuButton =
  document.getElementById("menuButton");

const menu =
  document.getElementById("menu");

const status =
  document.getElementById("status");

const historyPanel =
  document.getElementById("historyPanel");

const languagePanel =
  document.getElementById("languagePanel");

const settingsPanel =
  document.getElementById("settingsPanel");

const historyList =
  document.getElementById("historyList");

let messages = [];

let currentLanguage =
  localStorage.getItem("hacker_f5_language") ||
  "Français";


/* OUTILS */

function useTool(type) {

  const prompts = {

    image: "Je veux générer une image : ",
    video: "Je veux générer une vidéo : ",
    pdf: "Je veux créer un PDF : ",
    ppt: "Je veux créer une présentation PowerPoint : ",
    file: "Je veux créer un fichier ou un ZIP : ",
    voice: "Je veux utiliser la voix IA : ",
    music: "Je veux créer une musique : ",
    web: "Recherche sur le web : ",
    code: "Aide-moi avec du code : "

  };

  messageInput.value =
    prompts[type] || "";

  tools.classList.remove("active");

  messageInput.focus();
}


/* ESCAPE HTML */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* FORMATAGE IA */

function renderAIText(text) {

  if (typeof text !== "string") {
    text = String(text ?? "");
  }

  const escaped =
    escapeHTML(text);

  const parts =
    escaped.split(/(```[\s\S]*?```)/g);

  return parts.map(part => {

    if (
      part.startsWith("```") &&
      part.endsWith("```")
    ) {

      const lines =
        part
          .slice(3, -3)
          .split("\n");

      const language =
        lines.shift() || "code";

      const code =
        lines.join("\n");

      return `
        <div class="code-container">

          <div class="code-header">

            <span>${language}</span>

            <button
              class="copy-code"
              onclick="copyCode(this)"
            >
              Copier
            </button>

          </div>

          <pre>${code}</pre>

        </div>
      `;

    }

    return part
      .replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      )
      .replace(/\n/g, "<br>");

  }).join("");

}


/* MESSAGE */

function addMessage(text, type) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if (type === "ai") {

    bubble.innerHTML =
      renderAIText(text);

  } else {

    bubble.textContent =
      String(text ?? "");

  }

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* COPIER CODE */

function copyCode(button) {

  const code =
    button
      .closest(".code-container")
      .querySelector("pre")
      .innerText;

  navigator.clipboard
    .writeText(code)
    .then(() => {

      button.textContent = "Copié";

      setTimeout(() => {
        button.textContent = "Copier";
      }, 1500);

    })
    .catch(() => {
      button.textContent = "Erreur";
    });

}


/* ENVOYER */

async function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) {
    return;
  }

  messageInput.value = "";

  messageInput.style.height = "auto";

  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  sendButton.disabled = true;

  status.textContent =
    "F5 CORE • PROCESSING...";

  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          messages: messages,

          language: currentLanguage

        })

      });

    const raw =
      await response.text();

    let data;

    try {

      data =
        JSON.parse(raw);

    } catch (parseError) {

      console.error(
        "Réponse brute du serveur :",
        raw
      );

      throw new Error(
        "Réponse serveur invalide."
      );

    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        "Erreur serveur."
      );

    }

    /*
     * NOUVEAU :
     * chat.js renvoie maintenant
     * { answer: "..." }
     */

    let answer = "";

    if (
      typeof data?.answer === "string"
    ) {

      answer =
        data.answer;

    } else {

      answer =
        extractAIText(data);

    }

    if (!answer) {

      console.error(
        "Réponse reçue :",
        data
      );

      throw new Error(
        "HACKER F5 n'a retourné aucun texte."
      );

    }

    addMessage(
      answer,
      "ai"
    );

    messages.push({
      role: "assistant",
      content: answer
    });

    localStorage.setItem(
      "hacker_f5_messages",
      JSON.stringify(messages)
    );

    status.textContent =
      "F5 CORE • ONLINE";

  } catch (error) {

    console.error(
      "HACKER F5 :",
      error
    );

    addMessage(
      "⚠️ Erreur HACKER F5 :\n\n" +
      String(error?.message || error),
      "ai"
    );

    status.textContent =
      "F5 CORE • ERROR";

  }

  sendButton.disabled = false;

  messageInput.focus();

}


/* EXTRAIRE REPONSE */

function extractAIText(data) {

  if (!data) {
    return "";
  }

  if (typeof data === "string") {
    return data;
  }

  if (
    typeof data.output_text === "string"
  ) {
    return data.output_text;
  }

  if (
    typeof data.content === "string"
  ) {
    return data.content;
  }

  if (
    Array.isArray(data.outputs)
  ) {

    for (
      const output of data.outputs
    ) {

      if (!output) {
        continue;
      }

      if (
        typeof output === "string"
      ) {
        return output;
      }

      if (
        typeof output.text === "string"
      ) {
        return output.text;
      }

      if (
        typeof output.content === "string"
      ) {
        return output.content;
      }

      if (
        Array.isArray(output.content)
      ) {

        const result =
          output.content
            .map(item => {

              if (
                typeof item === "string"
              ) {
                return item;
              }

              if (
                typeof item?.text === "string"
              ) {
                return item.text;
              }

              if (
                typeof item?.content === "string"
              ) {
                return item.content;
              }

              return "";

            })
            .join("");

        if (result) {
          return result;
        }

      }

      if (output.message) {

        const nested =
          extractAIText({
            content:
              output.message.content
          });

        if (nested) {
          return nested;
        }

      }

    }

  }

  return "";
}


/* OUTILS BUTTON */

toolsButton.addEventListener(
  "click",
  function() {

    tools.classList.toggle("active");

  }
);


/* MENU */

menuButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    menu.style.display =
      menu.style.display === "block"
        ? "none"
        : "block";

  }
);


/* NOUVELLE CONVERSATION */

function newConversation() {

  messages = [];

  chat.innerHTML = "";

  localStorage.removeItem(
    "hacker_f5_messages"
  );

  menu.style.display = "none";

  status.textContent =
    "F5 CORE • READY";

  messageInput.focus();

}


/* EFFACER */

function clearChat() {
  newConversation();
}


/* HISTORIQUE */

let conversations = JSON.parse(
  localStorage.getItem("hackerF5_history") || "[]"
);

function saveHistory() {

  localStorage.setItem(
    "hackerF5_history",
    JSON.stringify(conversations)
  );

}

function saveCurrentConversation() {

  if (messages.length === 0) {
    return;
  }

  const firstMessage =
    messages.find(
      message => message.role === "user"
    );

  const title =
    firstMessage
      ? String(firstMessage.content).slice(0, 40)
      : "Nouvelle conversation";

  const conversation = {

    id: Date.now(),

    title: title,

    messages: [...messages],

    date:
      new Date().toLocaleString("fr-FR")

  };

  conversations.unshift(
    conversation
  );

  if (conversations.length > 30) {

    conversations =
      conversations.slice(0, 30);

  }

  saveHistory();

}


/* SAUVEGARDER */

function saveConversation() {

  saveCurrentConversation();

  updateHistory();

  status.textContent =
    "F5 CORE • SAVED";

  setTimeout(() => {

    status.textContent =
      "F5 CORE • ONLINE";

  }, 1500);

}


/* HISTORIQUE */

function updateHistory() {

  historyList.innerHTML = "";

  if (conversations.length === 0) {

    historyList.innerHTML = `
      <p style="
        color:#94a3b8;
        text-align:center;
        padding:20px;
      ">
        Aucun historique.
      </p>
    `;

    return;
  }

  conversations.forEach(
    conversation => {

      const item =
        document.createElement("button");

      item.className =
        "history-item";

      item.innerHTML = `
        <strong>
          ${escapeHTML(conversation.title)}
        </strong>

        <br>

        <small style="color:#64748b;">
          ${escapeHTML(conversation.date)}
        </small>
      `;

      item.onclick = function() {

        messages = [
          ...conversation.messages
        ];

        chat.innerHTML = "";

        messages.forEach(message => {

          if (message.role === "user") {

            addMessage(
              message.content,
              "user"
            );

          } else if (message.role === "assistant") {

            addMessage(
              message.content,
              "ai"
            );

          }

        });

        closePanels();

        status.textContent =
          "F5 CORE • ONLINE";

      };

      historyList.appendChild(item);

    }
  );

}


/* OUVRIR HISTORIQUE */

function openHistory() {

  menu.style.display = "none";

  updateHistory();

  historyPanel.style.display =
    "block";

}


/* LANGUE */

function openLanguage() {

  menu.style.display = "none";

  languagePanel.style.display =
    "block";

}


function setLanguage(language) {

  currentLanguage =
    language;

  localStorage.setItem(
    "hacker_f5_language",
    language
  );

  closePanels();

  status.textContent =
    "LANGUE • " + language;

  setTimeout(() => {

    status.textContent =
      "F5 CORE • ONLINE";

  }, 1500);

}


/* PARAMÈTRES */

function openSettings() {

  menu.style.display = "none";

  settingsPanel.style.display =
    "block";

}


/* FERMER LES PANNEAUX */

function closePanels() {

  historyPanel.style.display =
    "none";

  languagePanel.style.display =
    "none";

  settingsPanel.style.display =
    "none";

}


/* STATUT */

function toggleStatus() {

  if (
    status.style.display === "none"
  ) {

    status.style.display = "block";

  } else {

    status.style.display = "none";

  }

}


/* À PROPOS */

function showAbout() {

  menu.style.display = "none";

  alert(
    "HACKER F5 👑\n\n" +
    "Assistant IA de cybersécurité responsable.\n\n" +
    "HACKF5 — by King Franck"
  );

}


/* CHARGER LES MESSAGES */

function loadMessages() {

  const saved =
    localStorage.getItem(
      "hacker_f5_messages"
    );

  if (!saved) {

    addMessage(
      "Bonjour 👑 Je suis HACKER F5. Comment puis-je t'aider ?",
      "ai"
    );

    return;

  }

  try {

    messages =
      JSON.parse(saved);

    messages.forEach(message => {

      if (message.role === "user") {

        addMessage(
          message.content,
          "user"
        );

      }

      if (message.role === "assistant") {

        addMessage(
          message.content,
          "ai"
        );

      }

    });

  } catch (error) {

    console.error(
      "Erreur chargement messages :",
      error
    );

    messages = [];

    addMessage(
      "Bonjour 👑 Je suis HACKER F5. Comment puis-je t'aider ?",
      "ai"
    );

  }

}


/* MICROPHONE */

let recognition = null;

if (
  "webkitSpeechRecognition" in window ||
  "SpeechRecognition" in window
) {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "fr-FR";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.onstart =
    function() {

      status.textContent =
        "MICRO • ÉCOUTE...";

      micButton.textContent =
        "⏹️";

    };

  recognition.onresult =
    function(event) {

      const transcript =
        event.results[0][0].transcript;

      messageInput.value =
        transcript;

      messageInput.focus();

    };

  recognition.onerror =
    function() {

      status.textContent =
        "MICRO • ERREUR";

      micButton.textContent =
        "🎤";

    };

  recognition.onend =
    function() {

      micButton.textContent =
        "🎤";

      status.textContent =
        "F5 CORE • ONLINE";

    };

}


/* BOUTON MICRO */

micButton.addEventListener(
  "click",
  function() {

    if (!recognition) {

      alert(
        "La reconnaissance vocale n'est pas disponible sur ce navigateur."
      );

      return;

    }

    recognition.start();

  }
);


/* LECTURE VOCALE */

let speaking = false;

voiceButton.addEventListener(
  "click",
  function() {

    if (
      !("speechSynthesis" in window)
    ) {

      alert(
        "La lecture vocale n'est pas disponible."
      );

      return;

    }

    if (speaking) {

      speechSynthesis.cancel();

      speaking = false;

      voiceButton.textContent =
        "🔊";

      return;

    }

    const aiMessages =
      chat.querySelectorAll(
        ".message.ai .bubble"
      );

    if (aiMessages.length === 0) {
      return;
    }

    const last =
      aiMessages[
        aiMessages.length - 1
      ];

    const text =
      last.innerText.trim();

    if (!text) {
      return;
    }

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      currentLanguage === "English"
        ? "en-US"
        : currentLanguage === "Español"
          ? "es-ES"
          : "fr-FR";

    utterance.onstart =
      function() {

        speaking = true;

        voiceButton.textContent =
          "⏹️";

      };

    utterance.onend =
      function() {

        speaking = false;

        voiceButton.textContent =
          "🔊";

      };

    speechSynthesis.speak(
      utterance
    );

  }
);


/* ENTRÉE CLAVIER */

messageInput.addEventListener(
  "input",
  function() {

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        120
      ) + "px";

  }
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* BOUTON ENVOYER */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* FERMER LE MENU EN CLIQUANT AILLEURS */

document.addEventListener(
  "click",
  function(event) {

    if (
      !menu.contains(event.target) &&
      !menuButton.contains(event.target)
    ) {

      menu.style.display =
        "none";

    }

  }
);


/* FERMER PANNEAUX */

document.querySelectorAll(
  ".panel"
).forEach(panel => {

  panel.addEventListener(
    "click",
    function(event) {

      if (
        event.target === panel
      ) {

        closePanels();

      }

    }
  );

});


/* DÉMARRAGE */

loadMessages();

updateHistory();

messageInput.focus();

</script>

</body>
</html>
