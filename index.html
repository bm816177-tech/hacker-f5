<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HACKER F5 👑</title>

<style>
:root{
  --bg:#030405;
  --panel:#090c11;
  --panel2:#0d1118;
  --line:#242b35;
  --red:#ff1744;
  --text:#f4f7fb;
  --muted:#8993a3;
  --green:#22e6a7;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -15%,#3b0b18 0,#08090c 35%,#030405 75%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:820px;
  margin:auto;
  padding:10px 10px 130px;
}

/* HEADER */

.top{
  display:flex;
  align-items:center;
  gap:12px;
  padding:7px 4px 15px;
}

.logo{
  width:60px;
  height:60px;
  border-radius:50%;
  border:2px solid var(--red);
  object-fit:cover;
  background:#07090c;
  box-shadow:0 0 14px #ff174455,0 0 30px #ff174422;
}

.brand b{
  display:block;
  font-size:22px;
}

.brand small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* PANEL */

.panel,
.banner{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#0d1118,#07090d);
  border-radius:18px;
  box-shadow:0 0 35px #0009;
}

.panel{
  padding:15px;
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.panel-title h2{
  margin:0;
  font-size:18px;
}

.live{
  color:var(--green);
  font-size:10px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  min-height:61px;
  border:1px solid #202631;
  border-radius:13px;
  padding:10px;
  background:#080b10;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px;
}

.stat b{
  font-size:11px;
}

/* BANNER */

.banner{
  margin-top:11px;
  padding:9px;
}

.banner-frame{
  min-height:45px;
  border:1px solid #343b47;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 11px;
}

.banner-text{
  flex:1;
  text-align:center;
  font-family:monospace;
  font-size:11px;
  letter-spacing:.6px;
  overflow:hidden;
  white-space:nowrap;
}

.dot{
  width:9px;
  height:9px;
  flex:none;
  border-radius:50%;
  background:#444;
}

.dot.active{
  background:var(--red);
  box-shadow:0 0 12px var(--red);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.25}
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:11px 0;
}

.action-btn,
.mode-btn,
.tool{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#0d1117,#090c11);
  color:#fff;
}

.action-btn{
  border-radius:13px;
  padding:12px 6px;
  font-size:11px;
  font-weight:bold;
}

.action-btn:active,
.mode-btn:active,
.tool:active,
.send:active{
  transform:scale(.96);
}

/* MODES */

.mode{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.mode::-webkit-scrollbar{
  display:none;
}

.mode-btn{
  white-space:nowrap;
  border-radius:13px;
  padding:10px 13px;
  font-size:11px;
  font-weight:bold;
}

.mode-btn.active{
  border-color:#ff174488;
  box-shadow:0 0 18px #ff17441c;
}

/* CHAT */

.chat{
  min-height:360px;
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px;
}

.msg{
  max-width:94%;
  padding:13px;
  border-radius:15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.45;
  font-size:14px;
}

.msg.user{
  align-self:flex-end;
  background:#241018;
  border:1px solid #54202d;
}

.msg.bot{
  align-self:flex-start;
  background:#0c1016;
  border:1px solid #242b35;
}

.msg.system{
  align-self:center;
  max-width:100%;
  color:var(--muted);
  font-size:11px;
  text-align:center;
  border:1px dashed #252b35;
  background:#080a0d;
}

/* PROGRESSION */

.progress-box{
  min-width:260px;
  border:1px solid #292f39;
  background:#080b10;
  border-radius:13px;
  padding:12px;
  font-family:monospace;
  font-size:11px;
}

.progress-title{
  margin-bottom:9px;
}

.progress-bar{
  height:7px;
  border-radius:20px;
  overflow:hidden;
  background:#181c23;
}

.progress-fill{
  width:0%;
  height:100%;
  background:var(--red);
  box-shadow:0 0 12px var(--red);
  transition:width .5s ease;
}

.progress-status{
  margin-top:7px;
  color:var(--muted);
}

/* MEDIA */

.media{
  display:block;
  width:100%;
  max-width:100%;
  margin-top:10px;
  border-radius:12px;
  background:#000;
}

.download{
  display:inline-block;
  margin-top:9px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  color:#fff;
  text-decoration:none;
  font-size:12px;
}

/* MENU */

.menu{
  position:fixed;
  left:10px;
  right:10px;
  bottom:73px;
  max-width:820px;
  margin:auto;
  z-index:80;
  padding:12px;
  border:1px solid #343b47;
  border-radius:17px;
  background:#090c11f5;
  backdrop-filter:blur(18px);
  box-shadow:0 0 30px #000;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.menu button{
  padding:12px 5px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0d1117;
  color:#fff;
  font-size:11px;
}

/* COMPOSER */

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:70;
  padding:8px 9px;
  background:#050608ee;
  backdrop-filter:blur(15px);
  border-top:1px solid #1c222b;
}

.compose{
  max-width:820px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:6px;
}

.tool{
  width:43px;
  height:48px;
  flex:none;
  border-radius:13px;
  font-size:18px;
}

.voice.recording{
  border-color:var(--red);
  color:var(--red);
  box-shadow:0 0 15px #ff174444;
  animation:pulse 1s infinite;
}

.compose textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:130px;
  border:1px solid var(--line);
  background:#090c11;
  color:#fff;
  border-radius:14px;
  padding:13px;
  outline:none;
  font-size:14px;
}

.send{
  width:48px;
  height:48px;
  flex:none;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  font-size:20px;
}

/* UTILS */

.hidden{
  display:none!important;
}

.hint{
  color:var(--muted);
  font-size:10px;
  text-align:center;
  margin-top:10px;
  line-height:1.5;
}

@media(max-width:430px){

  .actions{
    grid-template-columns:repeat(2,1fr);
  }

  .brand b{
    font-size:19px;
  }

  .logo{
    width:54px;
    height:54px;
  }

  .compose{
    gap:4px;
  }

  .tool{
    width:40px;
  }

  .send{
    width:44px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<img
  id="logo"
  class="logo"
  alt="HACKER F5"
  src=""
>

<div class="brand">
<b>👑 HACKER F5</b>
<small>Assistant IA de cybersécurité responsable</small>
</div>

</header>


<section class="panel">

<div class="panel-title">
<h2>👑 HACKER F5</h2>
<span class="live">● EN LIGNE</span>
</div>

<div class="grid">

<div class="stat">
<span>STATUT</span>
<b>● ACTIF</b>
</div>

<div class="stat">
<span>MODE</span>
<b>⚡ ACTIF</b>
</div>

<div class="stat">
<span>IA</span>
<b>● EN LIGNE</b>
</div>

<div class="stat">
<span>ÉTAT</span>
<b>● STABLE</b>
</div>

<div class="stat">
<span>SESSION</span>
<b>● ACTIVE</b>
</div>

<div class="stat">
<span>SYSTÈME</span>
<b>● OPÉRATIONNEL</b>
</div>

<div class="stat">
<span>OUTILS</span>
<b>● DISPONIBLES</b>
</div>

<div class="stat">
<span>MODE ACTUEL</span>
<b id="modeLabel">CHAT IA</b>
</div>

</div>
</section>


<section class="banner">

<div class="banner-frame">

<i id="dot1" class="dot active"></i>

<div id="activity" class="banner-text">
PRÊT...
</div>

<i id="dot2" class="dot active"></i>

</div>

</section>


<div class="actions">

<button class="action-btn" onclick="setMode('image')">
🖼️ Image
</button>

<button class="action-btn" onclick="setMode('video')">
🎬 Vidéo
</button>

<button class="action-btn" onclick="setMode('music')">
🎵 Musique
</button>

<button class="action-btn" onclick="setMode('web')">
🌐 Recherche
</button>

<button class="action-btn" onclick="setMode('document')">
📄 Document
</button>

<button class="action-btn" onclick="newChat()">
🆕 Nouveau
</button>

</div>


<div class="mode">

<button class="mode-btn active"
data-mode="chat"
onclick="setMode('chat')">
💬 Chat
</button>

<button class="mode-btn"
data-mode="code"
onclick="setMode('code')">
💻 Code
</button>

<button class="mode-btn"
data-mode="cyber"
onclick="setMode('cyber')">
🛡️ Cyber
</button>

<button class="mode-btn"
data-mode="decode"
onclick="setMode('decode')">
🔐 Décodage
</button>

<button class="mode-btn"
data-mode="files"
onclick="setMode('files')">
📎 Fichiers
</button>

</div>


<main id="chat" class="chat"></main>


<input
id="file"
type="file"
class="hidden"
onchange="readFile(event)"
accept=".txt,.md,.csv,.json,.js,.html,.css,.py,.java,.php,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"
>


<div class="hint">
/image · /video · /music · /pdf · /docx · /xlsx · /pptx · /txt · /md · /csv
</div>

</div>


<!-- MENU + -->

<div id="plusMenu" class="menu hidden">

<div class="menu-grid">

<button onclick="setMode('image');closeMenus()">
🖼️ Image
</button>

<button onclick="setMode('video');closeMenus()">
🎬 Vidéo
</button>

<button onclick="setMode('music');closeMenus()">
🎵 Musique
</button>

<button onclick="setMode('document');closeMenus()">
📄 Document
</button>

<button onclick="document.getElementById('file').click();closeMenus()">
📎 Fichier
</button>

<button onclick="newChat();closeMenus()">
🆕 Nouveau
</button>

</div>

</div>


<!-- MENU = -->

<div id="equalMenu" class="menu hidden">

<div class="menu-grid">

<button onclick="setMode('code');closeMenus()">
💻 Code
</button>

<button onclick="setMode('cyber');closeMenus()">
🛡️ Cyber
</button>

<button onclick="setMode('decode');closeMenus()">
🔐 Décodage
</button>

<button onclick="setMode('web');closeMenus()">
🌐 Recherche
</button>

<button onclick="speakLast();closeMenus()">
🔊 Lire
</button>

<button onclick="stopVoice();closeMenus()">
⏹️ Stop vocal
</button>

</div>

</div>


<!-- COMPOSER -->

<div class="composer">

<div class="compose">

<button
class="tool"
title="Ajouter"
onclick="togglePlus()">
+
</button>

<button
class="tool"
title="Options"
onclick="toggleEqual()">
=
</button>

<button
id="voiceButton"
class="tool voice"
title="Vocal"
onclick="toggleVoice()">
🎙️
</button>

<textarea
id="input"
placeholder="Écris à HACKER F5..."
onkeydown="key(event)"
></textarea>

<button
class="send"
onclick="send()">
➤
</button>

</div>

</div>


<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const activity=document.getElementById("activity");
const modeLabel=document.getElementById("modeLabel");
const voiceButton=document.getElementById("voiceButton");

let messages=[];
let currentMode="chat";
let recognition=null;
let listening=false;

let history=[];

try{
history=JSON.parse(
localStorage.getItem("hacker_f5_history")||"[]"
);
}catch{
history=[];
}


/* LOGO */

const savedLogo=localStorage.getItem("hacker_f5_logo");

if(savedLogo){
document.getElementById("logo").src=savedLogo;
}


/* SECURITE HTML */

function esc(value){

return String(value).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


/* MESSAGES */

function addMessage(role,text,extra=""){

const element=document.createElement("div");

element.className="msg "+role;

element.innerHTML=esc(text)+extra;

chat.appendChild(element);

chat.scrollTop=chat.scrollHeight;

return element;
}


/* HUD */

function setWorking(text){

activity.textContent=text;

document.getElementById("dot1")
.classList.add("active");

document.getElementById("dot2")
.classList.add("active");
}

function setReady(){

activity.textContent="PRÊT...";
}


/* MENUS */

function closeMenus(){

document.getElementById("plusMenu")
.classList.add("hidden");

document.getElementById("equalMenu")
.classList.add("hidden");

}

function togglePlus(){

const menu=document.getElementById("plusMenu");

document.getElementById("equalMenu")
.classList.add("hidden");

menu.classList.toggle("hidden");

}

function toggleEqual(){

const menu=document.getElementById("equalMenu");

document.getElementById("plusMenu")
.classList.add("hidden");

menu.classList.toggle("hidden");

}


/* MODES */

function setMode(mode){

currentMode=mode;

modeLabel.textContent=mode.toUpperCase();

document.querySelectorAll(".mode-btn")
.forEach(button=>{
button.classList.toggle(
"active",
button.dataset.mode===mode
);
});

if(mode==="files"){

document.getElementById("file").click();
return;

}

if(mode==="image")
input.placeholder="Décris l'image à générer...";

else if(mode==="video")
input.placeholder="Décris la vidéo à générer...";

else if(mode==="music")
input.placeholder="Décris la musique ou chanson...";

else if(mode==="web")
input.placeholder="Que veux-tu rechercher ?";

else if(mode==="document")
input.placeholder="Décris le document à créer...";

else
input.placeholder="Écris à HACKER F5...";

input.focus();

}


/* NOUVELLE CONVERSATION */

function newChat(){

messages=[];
chat.innerHTML="";

addMessage(
"bot",
"Lab HACKF5 ACTIVATE 🇦🇱 HACKF5 ✍️(by - king 👑 Franck)"
);

addMessage(
"system",
"HACKER F5 est prêt. Comment puis-je t'aider ?"
);

setReady();

}


/* HISTORIQUE */

function saveHistory(){

try{

localStorage.setItem(
"hacker_f5_history",
JSON.stringify(history.slice(-50))
);

}catch{}

}


/* CLAVIER */

function key(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();
send();

}

}


/* PROGRESSION */

function progressMessage(title){

const box=document.createElement("div");

box.className="msg bot";

box.innerHTML=`
<div class="progress-box">

<div class="progress-title">
👑 ${esc(title)}
</div>

<div class="progress-bar">
<div class="progress-fill"></div>
</div>

<div class="progress-status">
Initialisation...
</div>

</div>
`;

chat.appendChild(box);

chat.scrollTop=chat.scrollHeight;

return{
box,
fill:box.querySelector(".progress-fill"),
status:box.querySelector(".progress-status")
};

}


function updateProgress(progress,value,status){

progress.fill.style.width=value+"%";
progress.status.textContent=status;

}


/* ENVOI */

async function send(){

const text=input.value.trim();

if(!text)return;

input.value="";

closeMenus();

addMessage("user",text);

messages.push({
role:"user",
content:text
});


let command=null;

if(/^\/image\s+/i.test(text))
command="image";

else if(/^\/video\s+/i.test(text))
command="video";

else if(/^\/music\s+/i.test(text))
command="music";

else if(/^\/(pdf|docx|xlsx|pptx|txt|md|csv)\s+/i.test(text))
command=text.match(/^\/(\w+)/i)[1].toLowerCase();


try{

if(command==="image"){

await generateImage(
text.replace(/^\/image\s+/i,"")
);

return;
}


if(command==="video"){

await generateVideo(
text.replace(/^\/video\s+/i,"")
);

return;
}


if(command==="music"){

await generateMusic(
text.replace(/^\/music\s+/i,"")
);

return;
}


if([
"pdf",
"docx",
"xlsx",
"pptx",
"txt",
"md",
"csv"
].includes(command)){

await generateDoc(
command,
text.replace(/^\/\w+\s+/i,"")
);

return;
}


if(currentMode==="web"){

await webSearch(text);

return;
}


/* MISTRAL */

setWorking(
currentMode==="code"
?"ANALYSE DU CODE..."
:
currentMode==="cyber"
?"ANALYSE CYBERSÉCURITÉ..."
:
currentMode==="decode"
?"ANALYSE / DÉCODAGE..."
:
"ANALYSE EN COURS..."
);


const response=await fetch(
"/api/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
messages,
mode:currentMode
})
}
);


const data=await response.json();


if(!response.ok||!data.ok){

throw new Error(
data.error||"Erreur serveur"
);

}


const answer=data.answer||"Réponse vide.";

addMessage("bot",answer);

messages.push({
role:"assistant",
content:answer
});

history.push({
time:new Date().toISOString(),
question:text,
answer
});

saveHistory();


/* LECTURE VOCALE OPTIONNELLE */

if(localStorage.getItem("hacker_f5_auto_voice")==="true"){
speak(answer);
}

}

catch(error){

addMessage(
"bot",
"⚠️ "+(
error.message||
"Une erreur est survenue."
)
);

}

finally{

setReady();

}

}


/* IMAGE */

async function generateImage(prompt){

if(!prompt){

addMessage(
"bot",
"Décris l'image que tu veux générer."
);

return;
}

setWorking("GÉNÉRATION DE L'IMAGE...");

const progress=
progressMessage("GÉNÉRATION IMAGE");

updateProgress(
progress,
20,
"Préparation..."
);

const response=await fetch(
"/api/generate-image",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({prompt})
}
);

updateProgress(
progress,
70,
"Traitement..."
);

const data=await response.json();

if(!response.ok||!data.ok){

throw new Error(
data.error||
"Génération image impossible"
);

}

updateProgress(
progress,
100,
"Terminé."
);

if(data.image){

addMessage(
"bot",
"🖼️ Image générée.",
`
<img
class="media"
src="${esc(data.image)}"
alt="Image générée"
>
<a
class="download"
href="${esc(data.image)}"
target="_blank"
rel="noopener">
📥 Ouvrir / télécharger
</a>
`
);

}else{

throw new Error(
"Aucune image retournée."
);

}

}


/* VIDEO */

async function generateVideo(prompt){

if(!prompt){

addMessage(
"bot",
"Décris la vidéo que tu veux générer."
);

return;
}

setWorking("GÉNÉRATION DE LA VIDÉO...");

const progress=
progressMessage("GÉNÉRATION VIDÉO");

updateProgress(
progress,
15,
"Initialisation..."
);

const response=await fetch(
"/api/generate-video",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({prompt})
}
);

updateProgress(
progress,
75,
"Traitement..."
);

const data=await response.json();

if(!response.ok||!data.ok){

throw new Error(
data.error||
"Génération vidéo impossible"
);

}

updateProgress(
progress,
100,
"Vidéo prête."
);

if(data.video){

addMessage(
"bot",
"🎬 Vidéo générée.",
`
<video
class="media"
controls
src="${esc(data.video)}">
</video>

<a
class="download"
href="${esc(data.video)}"
target="_blank"
rel="noopener">
📥 Ouvrir
</a>
`
);

}else{

addMessage(
"bot",
"🎬 La demande vidéo a été envoyée."
);

}

}


/* MUSIQUE */

async function generateMusic(prompt){

if(!prompt){

addMessage(
"bot",
"Décris la musique ou la chanson."
);

return;
}

setWorking("CRÉATION DE LA MUSIQUE...");

/* DOCUMENTS */

async function generateDoc(format,content){

if(!content){

addMessage(
"bot",
"Indique le contenu du document."
);

return;
}

setWorking("GÉNÉRATION DU DOCUMENT...");

const progress=
progressMessage(
"GÉNÉRATION "+
format.toUpperCase()
);

updateProgress(
progress,
25,
"Préparation..."
);

const response=await fetch(
"/api/generate-document",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
format,
title:"HACKER F5",
content
})
}
);

if(!response.ok){

let errorData={};

try{
errorData=await response.json();
}catch{}

throw new Error(
errorData.error||
"Impossible de créer le document."
);

}

updateProgress(
progress,
90,
"Préparation du téléchargement..."
);

const blob=await response.blob();

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;
link.download="hacker-f5."+format;

document.body.appendChild(link);
link.click();
link.remove();

URL.recreateObjectURL(blob);

link.href=url;
link.download="hacker-f5."+format;

document.body.appendChild(link);
link.click();
link.remove();

URL.revokeObjectURL(url);

setReady();

}

/* LECTURE VOCALE */

function speak(text){

if(!("speechSynthesis" in window)){

return;
}

speechSynthesis.cancel();

const utterance=
new SpeechSynthesisUtterance(text);

utterance.lang="fr-FR";
utterance.rate=.95;
utterance.pitch=1;

speechSynthesis.speak(
utterance
);

}


function speakLast(){

const botMessages=
chat.querySelectorAll(".msg.bot");

if(!botMessages.length){

return;
}

const last=
botMessages[botMessages.length-1];

speak(
last.innerText
);

}


/* ARRÊT VOCAL */

function stopVoice(){

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

if(recognition){

try{
recognition.stop();
}catch{}

}

listening=false;

voiceButton.classList.remove(
"recording"
);

}


/* RECONNAISSANCE VOCALE */

function setupVoice(){

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

voiceButton.title=
"Reconnaissance vocale non disponible";

return;
}

recognition=
new SpeechRecognition();

recognition.lang="fr-FR";

recognition.continuous=false;

recognition.interimResults=true;


recognition.onstart=()=>{

listening=true;

voiceButton.classList.add(
"recording"
);

setWorking("ÉCOUTE VOCALE...");

};


recognition.onresult=(event)=>{

let result="";

for(
let i=event.resultIndex;
i<event.results.length;
i++
){

result+=
event.results[i][0].transcript;

}

input.value=result;

};


recognition.onerror=(event)=>{

console.log(
"Voice error:",
event.error
);

listening=false;

voiceButton.classList.remove(
"recording"
);

setReady();

};


recognition.onend=()=>{

listening=false;

voiceButton.classList.remove(
"recording"
);

setReady();

};

}


function toggleVoice(){

if(!recognition){

addMessage(
"bot",
"🎙️ La reconnaissance vocale n'est pas disponible sur ce navigateur."
);

return;
}

if(listening){

recognition.stop();

return;
}

try{

recognition.start();

}catch{

}

}


/* FICHIERS */

async function readFile(event){

const file=
event.target.files[0];

if(!file)return;

setWorking(
"LECTURE DU FICHIER..."
);

try{

const isText=
file.type.startsWith("text/")||
/\.(txt|md|csv|json|js|html|css|py|java|php)$/i
.test(file.name);

if(isText){

const content=
await file.text();

addMessage(
"user",
"📎 "+file.name
);

messages.push({
role:"user",
content:
`Fichier : ${file.name}\n\n${content}`
});

setWorking(
"ANALYSE DU FICHIER..."
);

const response=
await fetch(
"/api/chat",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
messages,
mode:"files"
})
}
);

const data=
await response.json();

if(
!response.ok||
!data.ok
){

throw new Error(
data.error||
"Analyse impossible"
);

}

const answer=
data.answer||
"Analyse terminée.";

addMessage(
"bot",
answer
);

messages.push({
role:"assistant",
content:answer
});

history.push({
time:
new Date().toISOString(),
question:
"Analyse du fichier "+file.name,
answer
});

saveHistory();

}else{

addMessage(
"system",
"📎 "+file.name+" reçu. Le fichier est prêt à être analysé."
);

const formData=
new FormData();

formData.append(
"file",
file
);

formData.append(
"filename",
file.name
);

setWorking(
"PRÉPARATION DU FICHIER..."
);

const response=
await fetch(
"/api/chat",
{
method:"POST",
body:formData
}
);

if(!response.ok){

throw new Error(
"Le fichier n'a pas pu être transmis."
);

}

addMessage(
"bot",
"📎 Fichier reçu. Pour les PDF, DOCX, XLSX et PPTX, l'analyse complète sera activée avec le module de traitement de documents."
);

}

}catch(error){

addMessage(
"bot",
"⚠️ "+
(
error.message||
"Impossible de lire ce fichier."
)
);

}finally{

event.target.value="";

setReady();

}

}
